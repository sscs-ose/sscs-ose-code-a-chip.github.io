[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI name: plain "viaduct" is taken by an unrelated package; reserve viaduct-eda first.
name = "viaduct-eda"
version = "0.3.0"
description = "Live bridge between LLM agents and the open-source analog stack (KLayout, xschem, ngspice, FastHenry)"
requires-python = ">=3.9"
dependencies = []          # host side is stdlib-only; container side uses the IIC-OSIC-TOOLS image

[project.scripts]
viaduct = "viaduct.cli:main"

[tool.setuptools]
packages = ["viaduct"]
