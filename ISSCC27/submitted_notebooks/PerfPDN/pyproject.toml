[project]
name = "perfpdn"
version = "0.0.0"
description = "Environment for the circuit-aware DC PDN workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "ciel==3.0.0",
  "klayout==0.30.12",
  "gdsfactory==8.20.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<8", "ipython>=9,<10", "ipywidgets>=8.1,<9"]

[tool.uv]
package = false

