<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="960" height="372" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="bold" fill="#1f2d3d">How this notebook measures a design decision</text>
  <text x="24" y="52" font-size="12.5" fill="#44546a">Every step uses open-source tools except the FPGA bitstream; the section number is given in each box.</text>

  <!-- lane 1: correctness -->
  <rect x="24" y="70" width="6" height="84" fill="#2a78d6"/>
  <text x="40" y="88" font-size="13" font-weight="bold" fill="#2a78d6">Is it correct?</text>
  <g font-size="12">
    <rect x="200" y="70" width="220" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="212" y="92" font-weight="bold" fill="#1f2d3d">Golden model  (§2)</text>
    <text x="212" y="112" fill="#44546a">• written from FIPS 203 / 202</text>
    <text x="212" y="130" fill="#44546a">• 3 oracles + NIST ACVP vectors</text>
    <rect x="450" y="70" width="220" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="462" y="92" font-weight="bold" fill="#1f2d3d">RTL simulation  (§3–4)</text>
    <text x="462" y="112" fill="#44546a">• Icarus Verilog, bit-exact</text>
    <text x="462" y="130" fill="#44546a">• cycle model, constant time</text>
    <rect x="700" y="70" width="236" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="712" y="92" font-weight="bold" fill="#1f2d3d">Formal proof  (§4)</text>
    <text x="712" y="112" fill="#44546a">• Yosys SAT, Barrett reducer</text>
    <text x="712" y="130" fill="#44546a">• correct for all 2²⁴ inputs</text>
  </g>
  <line x1="422" y1="112" x2="448" y2="112" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="672" y1="112" x2="698" y2="112" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- lane 2: cost -->
  <rect x="24" y="174" width="6" height="84" fill="#eb6834"/>
  <text x="40" y="192" font-size="13" font-weight="bold" fill="#eb6834">What does it cost?</text>
  <g font-size="12">
    <rect x="200" y="174" width="170" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="212" y="196" font-weight="bold" fill="#1f2d3d">Synthesis  (§5)</text>
    <text x="212" y="216" fill="#44546a">• Yosys + ABC, SKY130</text>
    <text x="212" y="234" fill="#44546a">• runs in Colab</text>
    <rect x="390" y="174" width="170" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="402" y="196" font-weight="bold" fill="#1f2d3d">Place &amp; route  (§6)</text>
    <text x="402" y="216" fill="#44546a">• OpenROAD flow scripts</text>
    <text x="402" y="234" fill="#44546a">• clock sweep, 3 corners</text>
    <rect x="580" y="174" width="170" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="592" y="196" font-weight="bold" fill="#1f2d3d">NTT iterations  (§7)</text>
    <text x="592" y="216" fill="#44546a">• packed pairs, two lanes</text>
    <text x="592" y="234" fill="#44546a">• gate-level energy</text>
    <rect x="770" y="174" width="166" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="782" y="196" font-weight="bold" fill="#1f2d3d">Two chips  (§8)</text>
    <text x="782" y="216" fill="#44546a">• 99,537 → 6,856 cycles</text>
    <text x="782" y="234" fill="#44546a">• sign-off, energy</text>
  </g>
  <line x1="372" y1="216" x2="388" y2="216" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="562" y1="216" x2="578" y2="216" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="752" y1="216" x2="768" y2="216" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- lane 3: practice and security -->
  <rect x="24" y="278" width="6" height="84" fill="#1baf7a"/>
  <text x="40" y="296" font-size="13" font-weight="bold" fill="#1baf7a">Does it hold up?</text>
  <g font-size="12">
    <rect x="200" y="278" width="345" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="212" y="300" font-weight="bold" fill="#1f2d3d">FPGA board  (§9)</text>
    <text x="212" y="320" fill="#44546a">• same RTL on a DE25-Nano, ESP32 host</text>
    <text x="212" y="338" fill="#44546a">• 100 ML-KEM runs, 100 HSM-invariant runs</text>
    <rect x="575" y="278" width="361" height="84" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
    <text x="587" y="300" font-weight="bold" fill="#1f2d3d">Leakage  (§10)</text>
    <text x="587" y="320" fill="#44546a">• fixed-vs-random TVLA, negative control</text>
    <text x="587" y="338" fill="#44546a">• cost of first-order masking</text>
  </g>
</svg>
