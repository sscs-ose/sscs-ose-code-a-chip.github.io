<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f4a44"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f1b17">HSKEM: post-quantum hardware security module</text>

  <!-- host -->
  <rect x="24" y="190" width="150" height="120" rx="8" fill="#f7f3ec" stroke="#a39b8f" stroke-width="1.5"/>
  <text x="99" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1b17">ESP32 host</text>
  <text x="40" y="246" font-size="12" fill="#4f4a44">• untrusted</text>
  <text x="40" y="264" font-size="12" fill="#4f4a44">• sends commands</text>
  <text x="40" y="282" font-size="12" fill="#4f4a44">• never sees keys</text>
  <line x1="176" y1="250" x2="236" y2="250" stroke="#4f4a44" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="206" y="240" text-anchor="middle" font-size="12" fill="#4f4a44">SPI</text>

  <!-- core outline -->
  <rect x="238" y="60" width="700" height="370" rx="10" fill="#fdfbf7" stroke="#6b5e50" stroke-width="2"/>
  <text x="588" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b5e50">HSKEM core (same RTL for FPGA and ASIC)</text>

  <!-- front end -->
  <rect x="256" y="104" width="150" height="306" rx="6" fill="#f7f3ec" stroke="#a39b8f"/>
  <text x="331" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">SPI front end</text>
  <text x="268" y="154" font-size="11.5" fill="#4f4a44">• framing + CRC-16</text>
  <text x="331" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">HSM policy</text>
  <text x="268" y="214" font-size="11.5" fill="#4f4a44">• key slots</text>
  <text x="268" y="230" font-size="11.5" fill="#4f4a44">• permissions</text>
  <text x="268" y="246" font-size="11.5" fill="#4f4a44">• anti-replay counters</text>
  <text x="268" y="262" font-size="11.5" fill="#4f4a44">• audit log, zeroize</text>
  <text x="331" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">Secure frames</text>
  <text x="268" y="314" font-size="11.5" fill="#4f4a44">• HMAC-SHA-256</text>
  <text x="268" y="332" font-size="11.5" fill="#4f4a44">• AES-256</text>

  <!-- ML-KEM -->
  <rect x="424" y="104" width="300" height="200" rx="6" fill="#f7f3ec" stroke="#a39b8f" stroke-width="1.5"/>
  <text x="574" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">ML-KEM-512 engine (FIPS 203)</text>
  <text x="574" y="148" text-anchor="middle" font-size="11.5" fill="#4f4a44">KeyGen · Encaps · Decaps with implicit rejection</text>
  <rect x="440" y="162" width="130" height="60" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="505" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a78d6">Shared NTT</text>
  <text x="505" y="204" text-anchor="middle" font-size="11" font-style="italic" fill="#4f4a44">studied here</text>
  <rect x="580" y="162" width="130" height="60" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="645" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#eb6834">Keccak-f[1600]</text>
  <text x="645" y="204" text-anchor="middle" font-size="11" font-style="italic" fill="#4f4a44">studied here</text>
  <text x="574" y="248" text-anchor="middle" font-size="11.5" fill="#4f4a44">SampleNTT · CBD samplers · compress / encode</text>
  <text x="574" y="270" text-anchor="middle" font-size="11.5" fill="#4f4a44">shared key K stays on chip (exportable = 0)</text>

  <!-- root of trust -->
  <rect x="742" y="104" width="180" height="200" rx="6" fill="#f7f0e6" stroke="#c49a5a" stroke-width="1.5"/>
  <text x="832" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">Root of trust</text>
  <text x="752" y="154" font-size="11" fill="#4f4a44">• RO-PUF + fuzzy extractor</text>
  <text x="766" y="172" font-size="11" fill="#4f4a44">→ device root key</text>
  <text x="752" y="200" font-size="11" fill="#4f4a44">• RO entropy, health tests</text>
  <text x="766" y="218" font-size="11" fill="#4f4a44">→ SHAKE-256 DRBG</text>
  <text x="752" y="246" font-size="11" fill="#4f4a44">• PUF-wrapped keys</text>
  <text x="766" y="264" font-size="11" fill="#4f4a44">→ two copies in host flash</text>

  <line x1="408" y1="200" x2="422" y2="200" stroke="#4f4a44" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="726" y1="200" x2="740" y2="200" stroke="#4f4a44" stroke-width="1.5" marker-start="url(#arr)"/>

  <!-- memories -->
  <rect x="424" y="322" width="498" height="88" rx="6" fill="#fbf1df" stroke="#d4a85a"/>
  <text x="673" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">On-chip memories</text>
  <text x="673" y="368" text-anchor="middle" font-size="11.5" fill="#4f4a44">FPGA: M20K blocks (dual-port NTT store)</text>
  <text x="673" y="388" text-anchor="middle" font-size="11.5" fill="#4f4a44">SKY130 (HSKEM-2): 18 OpenRAM single-port macros (7 types)</text>

  <!-- implementations -->
  <rect x="238" y="448" width="340" height="56" rx="8" fill="#f7f3ec" stroke="#6b5e50"/>
  <text x="408" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">FPGA prototype: DE25-Nano (Agilex 5)</text>
  <text x="408" y="491" text-anchor="middle" font-size="11.5" fill="#4f4a44">≈39k ALMs · 50 MHz (original configuration) · one board</text>
  <rect x="598" y="448" width="340" height="56" rx="8" fill="#f7f3ec" stroke="#6b5e50"/>
  <text x="768" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f1b17">ASIC (HSKEM-2): SKY130 HD, OpenROAD</text>
  <text x="768" y="491" text-anchor="middle" font-size="11.5" fill="#4f4a44">11.2 mm² die · 360k cells · LVS and DRC sign-off</text>
</svg>
