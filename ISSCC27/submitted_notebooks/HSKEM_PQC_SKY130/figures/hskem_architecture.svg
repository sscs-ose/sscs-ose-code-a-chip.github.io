<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2d3d">HSKEM: post-quantum hardware security module</text>

  <!-- host -->
  <rect x="24" y="190" width="150" height="120" rx="8" fill="#f2f4f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="99" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">ESP32 host</text>
  <text x="40" y="246" font-size="12" fill="#44546a">• untrusted</text>
  <text x="40" y="264" font-size="12" fill="#44546a">• sends commands</text>
  <text x="40" y="282" font-size="12" fill="#44546a">• never sees keys</text>
  <line x1="176" y1="250" x2="236" y2="250" stroke="#44546a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="206" y="240" text-anchor="middle" font-size="12" fill="#44546a">SPI</text>

  <!-- core outline -->
  <rect x="238" y="60" width="700" height="370" rx="10" fill="#fbfcfe" stroke="#2f5d8a" stroke-width="2"/>
  <text x="588" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d8a">HSKEM core (same RTL for FPGA and ASIC)</text>

  <!-- front end -->
  <rect x="256" y="104" width="150" height="306" rx="6" fill="#eef3f9" stroke="#8aa6c4"/>
  <text x="331" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">SPI front end</text>
  <text x="268" y="154" font-size="11.5" fill="#44546a">• framing + CRC-16</text>
  <text x="331" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">HSM policy</text>
  <text x="268" y="214" font-size="11.5" fill="#44546a">• key slots</text>
  <text x="268" y="230" font-size="11.5" fill="#44546a">• permissions</text>
  <text x="268" y="246" font-size="11.5" fill="#44546a">• anti-replay counters</text>
  <text x="268" y="262" font-size="11.5" fill="#44546a">• audit log, zeroize</text>
  <text x="331" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Secure frames</text>
  <text x="268" y="314" font-size="11.5" fill="#44546a">• HMAC-SHA-256</text>
  <text x="268" y="332" font-size="11.5" fill="#44546a">• AES-256</text>

  <!-- ML-KEM -->
  <rect x="424" y="104" width="300" height="200" rx="6" fill="#e8f1ea" stroke="#6ea37a" stroke-width="1.5"/>
  <text x="574" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">ML-KEM-512 engine (FIPS 203)</text>
  <text x="574" y="148" text-anchor="middle" font-size="11.5" fill="#44546a">KeyGen · Encaps · Decaps with implicit rejection</text>
  <rect x="440" y="162" width="130" height="60" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="505" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">Shared NTT</text>
  <text x="505" y="204" text-anchor="middle" font-size="11" font-style="italic" fill="#44546a">studied here</text>
  <rect x="580" y="162" width="130" height="60" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="645" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">Keccak-f[1600]</text>
  <text x="645" y="204" text-anchor="middle" font-size="11" font-style="italic" fill="#44546a">studied here</text>
  <text x="574" y="248" text-anchor="middle" font-size="11.5" fill="#44546a">SampleNTT · CBD samplers · compress / encode</text>
  <text x="574" y="270" text-anchor="middle" font-size="11.5" fill="#44546a">shared key K stays on chip (exportable = 0)</text>

  <!-- root of trust -->
  <rect x="742" y="104" width="180" height="200" rx="6" fill="#f7f0e6" stroke="#c49a5a" stroke-width="1.5"/>
  <text x="832" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Root of trust</text>
  <text x="752" y="154" font-size="11" fill="#44546a">• RO-PUF + fuzzy extractor</text>
  <text x="766" y="172" font-size="11" fill="#44546a">→ device root key</text>
  <text x="752" y="200" font-size="11" fill="#44546a">• RO entropy, health tests</text>
  <text x="766" y="218" font-size="11" fill="#44546a">→ SHAKE-256 DRBG</text>
  <text x="752" y="246" font-size="11" fill="#44546a">• power-cut-safe A/B key vault</text>

  <line x1="408" y1="200" x2="422" y2="200" stroke="#44546a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="726" y1="200" x2="740" y2="200" stroke="#44546a" stroke-width="1.5" marker-start="url(#arr)"/>

  <!-- memories -->
  <rect x="424" y="322" width="498" height="88" rx="6" fill="#f2f4f7" stroke="#8a97a8"/>
  <text x="673" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">On-chip memories</text>
  <text x="673" y="368" text-anchor="middle" font-size="11.5" fill="#44546a">FPGA: M20K blocks (dual-port NTT store)</text>
  <text x="673" y="388" text-anchor="middle" font-size="11.5" fill="#44546a">SKY130 (HSKEM-2): 18 OpenRAM single-port macros (7 types)</text>

  <!-- implementations -->
  <rect x="238" y="448" width="340" height="56" rx="8" fill="#eef3f9" stroke="#2f5d8a"/>
  <text x="408" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">FPGA prototype: DE25-Nano (Agilex 5)</text>
  <text x="408" y="491" text-anchor="middle" font-size="11.5" fill="#44546a">≈39k ALMs · 50 MHz · measured on one board</text>
  <rect x="598" y="448" width="340" height="56" rx="8" fill="#eef3f9" stroke="#2f5d8a"/>
  <text x="768" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">ASIC (HSKEM-2): SKY130 HD, OpenROAD</text>
  <text x="768" y="491" text-anchor="middle" font-size="11.5" fill="#44546a">11.2 mm² die · 362k cells · LVS and DRC sign-off</text>
</svg>
