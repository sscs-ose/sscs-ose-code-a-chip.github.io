<text x="16" y="28" font-size="19" fill="#0b0b0b" font-weight="bold" font-style="normal" text-anchor="start">One butterfly lane of HSKEM-2, operator by operator</text>
<text x="16" y="49" font-size="12.5" fill="#52514e" font-weight="normal" font-style="normal" text-anchor="start">Two identical lanes share one ζ, one per half of a word pair. Forward: a′ = a + ζb, b′ = a − ζb. Inverse: a′ = a + b, b′ = ζ(b − a).</text>
