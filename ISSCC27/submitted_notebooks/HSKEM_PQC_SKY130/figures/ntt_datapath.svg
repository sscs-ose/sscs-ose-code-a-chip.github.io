<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Helvetica, Arial, sans-serif">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2d3d">NTT butterfly datapath (one butterfly at a time)</text>

  <!-- store -->
  <rect x="24" y="90" width="150" height="150" rx="6" fill="#f2f4f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="99" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Coefficient store</text>
  <text x="99" y="140" text-anchor="middle" font-size="11.5" fill="#44546a">256 × 16 bit</text>
  <text x="99" y="170" text-anchor="middle" font-size="11" fill="#44546a">FPGA: dual-port</text>
  <text x="99" y="188" text-anchor="middle" font-size="11" fill="#44546a">ASIC: single-port</text>
  <text x="99" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d4f">iteration: 12 bit</text>

  <!-- operand registers -->
  <rect x="214" y="80" width="84" height="44" rx="4" fill="#ffffff" stroke="#44546a"/>
  <text x="256" y="107" text-anchor="middle" font-size="12.5" fill="#1f2d3d">reg a_j</text>
  <rect x="214" y="150" width="84" height="44" rx="4" fill="#ffffff" stroke="#44546a"/>
  <text x="256" y="177" text-anchor="middle" font-size="12.5" fill="#1f2d3d">reg a_j+len</text>
  <rect x="214" y="220" width="84" height="44" rx="4" fill="#ffffff" stroke="#44546a"/>
  <text x="256" y="247" text-anchor="middle" font-size="12.5" fill="#1f2d3d">ζ ROM</text>
  <line x1="176" y1="120" x2="212" y2="102" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="176" y1="172" x2="212" y2="172" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- multiplier -->
  <rect x="340" y="150" width="104" height="114" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="392" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">12 × 12</text>
  <text x="392" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">multiplier</text>
  <line x1="300" y1="172" x2="338" y2="186" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="300" y1="242" x2="338" y2="228" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- pipeline register (iteration) -->
  <rect x="470" y="170" width="30" height="74" rx="3" fill="#e8f1ea" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="485" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d4f">pipeline</text>
  <text x="485" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d4f">register</text>
  <line x1="446" y1="207" x2="468" y2="207" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- barrett -->
  <rect x="526" y="150" width="130" height="114" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="591" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Barrett mod q</text>
  <text x="591" y="202" text-anchor="middle" font-size="11" fill="#44546a">t = ⌊a·5039 / 2²⁴⌋</text>
  <text x="591" y="220" text-anchor="middle" font-size="11" fill="#44546a">r = a − t·q</text>
  <text x="591" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d4f">1 subtraction (proven)</text>
  <line x1="502" y1="207" x2="524" y2="207" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- reduced register + add/sub -->
  <rect x="684" y="185" width="70" height="44" rx="4" fill="#ffffff" stroke="#44546a"/>
  <text x="719" y="212" text-anchor="middle" font-size="12" fill="#1f2d3d">reg ζ·b</text>
  <line x1="658" y1="207" x2="682" y2="207" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="782" y="120" width="150" height="120" rx="6" fill="#eef3f9" stroke="#2f5d8a" stroke-width="1.5"/>
  <text x="857" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">add / subtract</text>
  <text x="857" y="170" text-anchor="middle" font-size="11" fill="#44546a">mod q</text>
  <text x="857" y="196" text-anchor="middle" font-size="11" fill="#44546a">a′ = a + ζb</text>
  <text x="857" y="214" text-anchor="middle" font-size="11" fill="#44546a">b′ = a − ζb</text>
  <line x1="756" y1="207" x2="780" y2="200" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M300,102 L760,102 L780,140" fill="none" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- write back -->
  <path d="M857,242 L857,320 L99,320 L99,242" fill="none" stroke="#44546a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="478" y="312" text-anchor="middle" font-size="11.5" fill="#44546a">write back a′, b′ (one port: two cycles)</text>

  <!-- legend -->
  <text x="24" y="360" font-size="11.5" fill="#44546a">Forward (Cooley–Tukey) butterfly shown; the inverse uses (b − a)·ζ. Red: critical path. Green: design iteration of Section 6b.</text>
</svg>
