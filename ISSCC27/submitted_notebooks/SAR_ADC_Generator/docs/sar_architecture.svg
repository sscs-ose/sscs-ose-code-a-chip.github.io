<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7b3fa0"/>
    </marker>
  </defs>
  <rect width="980" height="500" fill="#ffffff"/>

  <!-- top plate -->
  <line x1="128" y1="90" x2="712" y2="90" stroke="#1f5fbf" stroke-width="3"/>
  <text x="300" y="76" fill="#1f5fbf" font-weight="bold">top plate V<tspan baseline-shift="sub" font-size="10">x</tspan> (floats during conversion)</text>

  <!-- capacitor columns: cap, bottom node, 3-way switch, bus taps -->
  <g stroke="#222" stroke-width="2" fill="none">
    <!-- MSB x=150 -->
    <line x1="150" y1="90" x2="150" y2="112"/><line x1="128" y1="112" x2="172" y2="112" stroke-width="3.5"/>
    <line x1="128" y1="124" x2="172" y2="124" stroke-width="3.5"/><line x1="150" y1="124" x2="150" y2="170"/>
    <line x1="150" y1="170" x2="128" y2="207"/>
    <circle cx="126" cy="212" r="4"/><circle cx="150" cy="212" r="4"/><circle cx="174" cy="212" r="4"/>
    <!-- bit N-2 x=270 -->
    <line x1="270" y1="90" x2="270" y2="112"/><line x1="248" y1="112" x2="292" y2="112" stroke-width="3.5"/>
    <line x1="248" y1="124" x2="292" y2="124" stroke-width="3.5"/><line x1="270" y1="124" x2="270" y2="170"/>
    <line x1="270" y1="170" x2="248" y2="207"/>
    <circle cx="246" cy="212" r="4"/><circle cx="270" cy="212" r="4"/><circle cx="294" cy="212" r="4"/>
    <!-- LSB x=450 -->
    <line x1="450" y1="90" x2="450" y2="112"/><line x1="428" y1="112" x2="472" y2="112" stroke-width="3.5"/>
    <line x1="428" y1="124" x2="472" y2="124" stroke-width="3.5"/><line x1="450" y1="124" x2="450" y2="170"/>
    <line x1="450" y1="170" x2="428" y2="207"/>
    <circle cx="426" cy="212" r="4"/><circle cx="450" cy="212" r="4"/><circle cx="474" cy="212" r="4"/>
    <!-- dummy x=560: Vin or GND only -->
    <line x1="560" y1="90" x2="560" y2="112"/><line x1="538" y1="112" x2="582" y2="112" stroke-width="3.5"/>
    <line x1="538" y1="124" x2="582" y2="124" stroke-width="3.5"/><line x1="560" y1="124" x2="560" y2="170"/>
    <line x1="560" y1="170" x2="538" y2="207"/>
    <circle cx="536" cy="212" r="4"/><circle cx="584" cy="212" r="4"/>
  </g>
  <g fill="#222"><circle cx="150" cy="90" r="4"/><circle cx="270" cy="90" r="4"/><circle cx="450" cy="90" r="4"/><circle cx="560" cy="90" r="4"/>
    <circle cx="150" cy="170" r="3"/><circle cx="270" cy="170" r="3"/><circle cx="450" cy="170" r="3"/><circle cx="560" cy="170" r="3"/></g>
  <text x="360" y="128" font-size="26" text-anchor="middle" fill="#222">…</text>
  <g font-size="13" fill="#222">
    <text x="178" y="150">2<tspan baseline-shift="super" font-size="9">N−1</tspan>C</text>
    <text x="298" y="150">2<tspan baseline-shift="super" font-size="9">N−2</tspan>C</text>
    <text x="478" y="150">C</text>
    <text x="588" y="150">C<tspan dx="4" font-size="11">dummy</tspan></text>
    <text x="150" y="58" text-anchor="middle" font-size="12" fill="#555">MSB</text>
    <text x="450" y="58" text-anchor="middle" font-size="12" fill="#555">LSB</text>
  </g>

  <!-- buses: contacts tap down to Vin / Vref / GND -->
  <g stroke-width="2" fill="none">
    <g stroke="#2e7d32"><line x1="126" y1="216" x2="126" y2="262"/><line x1="246" y1="216" x2="246" y2="262"/>
      <line x1="426" y1="216" x2="426" y2="262"/><line x1="536" y1="216" x2="536" y2="262"/>
      <line x1="110" y1="262" x2="600" y2="262" stroke-width="2.5"/></g>
    <g stroke="#c0392b"><line x1="150" y1="216" x2="150" y2="292"/><line x1="270" y1="216" x2="270" y2="292"/>
      <line x1="450" y1="216" x2="450" y2="292"/>
      <line x1="110" y1="292" x2="600" y2="292" stroke-width="2.5"/></g>
    <g stroke="#555"><line x1="174" y1="216" x2="174" y2="322"/><line x1="294" y1="216" x2="294" y2="322"/>
      <line x1="474" y1="216" x2="474" y2="322"/><line x1="584" y1="216" x2="584" y2="322"/>
      <line x1="110" y1="322" x2="600" y2="322" stroke-width="2.5"/></g>
  </g>
  <g><circle cx="126" cy="262" r="3.5" fill="#2e7d32"/><circle cx="246" cy="262" r="3.5" fill="#2e7d32"/><circle cx="426" cy="262" r="3.5" fill="#2e7d32"/><circle cx="536" cy="262" r="3.5" fill="#2e7d32"/>
    <circle cx="150" cy="292" r="3.5" fill="#c0392b"/><circle cx="270" cy="292" r="3.5" fill="#c0392b"/><circle cx="450" cy="292" r="3.5" fill="#c0392b"/>
    <circle cx="174" cy="322" r="3.5" fill="#555"/><circle cx="294" cy="322" r="3.5" fill="#555"/><circle cx="474" cy="322" r="3.5" fill="#555"/><circle cx="584" cy="322" r="3.5" fill="#555"/></g>
  <!-- pins: Vin (sampled input) and Vref enter from the right; GND -->
  <g stroke-width="2">
    <polygon points="640,253 614,253 604,262 614,271 640,271" fill="#e6f2e7" stroke="#2e7d32"/>
    <polygon points="640,283 614,283 604,292 614,301 640,301" fill="#f8e5e3" stroke="#c0392b"/>
    <g stroke="#555" fill="none"><line x1="600" y1="322" x2="612" y2="322" stroke-width="2.5"/><line x1="612" y1="322" x2="612" y2="330"/>
      <line x1="600" y1="330" x2="624" y2="330"/><line x1="605" y1="335" x2="619" y2="335"/><line x1="609" y1="340" x2="615" y2="340"/></g>
  </g>
  <g font-size="14">
    <text x="648" y="267" fill="#2e7d32"><tspan font-weight="bold">V<tspan baseline-shift="sub" font-size="10">in</tspan></tspan><tspan dx="8" font-size="12.5">analog input pin (sampled)</tspan></text>
    <text x="648" y="297" fill="#c0392b"><tspan font-weight="bold">V<tspan baseline-shift="sub" font-size="10">ref</tspan></tspan><tspan dx="8" font-size="12.5">reference pin</tspan></text>
    <text x="632" y="338" fill="#555" font-weight="bold">GND</text>
  </g>
  <!-- sampling switch phase of each bottom plate's Vin contact -->
  <g font-size="12.5" fill="#2e7d32" text-anchor="end">
    <text x="121" y="244">φ<tspan baseline-shift="sub" font-size="9">s</tspan></text>
    <text x="241" y="244">φ<tspan baseline-shift="sub" font-size="9">g</tspan></text>
    <text x="421" y="244">φ<tspan baseline-shift="sub" font-size="9">g</tspan></text>
    <text x="531" y="244">φ<tspan baseline-shift="sub" font-size="9">g</tspan></text>
  </g>

  <!-- top-plate switch to Vcm, and Vcm to the comparator's - input -->
  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="650" y1="90" x2="650" y2="108"/>
    <circle cx="650" cy="112" r="4"/><line x1="650" y1="116" x2="664" y2="142"/><circle cx="650" cy="148" r="4"/>
    <line x1="650" y1="152" x2="650" y2="170"/>
    <line x1="650" y1="170" x2="712" y2="170"/>
    <line x1="650" y1="170" x2="650" y2="196"/>
    <circle cx="650" cy="208" r="12"/>
    <line x1="650" y1="220" x2="650" y2="234"/><line x1="638" y1="234" x2="662" y2="234"/><line x1="643" y1="239" x2="657" y2="239"/><line x1="647" y1="244" x2="653" y2="244"/>
  </g>
  <g fill="#222"><circle cx="650" cy="90" r="4"/><circle cx="650" cy="170" r="3.5"/></g>
  <text x="670" y="134" font-size="13">φ<tspan baseline-shift="sub" font-size="9">t</tspan></text>
  <text x="650" y="206" font-size="11" text-anchor="middle">+</text>
  <text x="650" y="217" font-size="12" text-anchor="middle">−</text>
  <text x="670" y="213" font-size="14" font-weight="bold">V<tspan baseline-shift="sub" font-size="10">cm</tspan></text>

  <!-- StrongARM comparator -->
  <polygon points="712,70 712,190 806,130" fill="#f3f6fb" stroke="#222" stroke-width="2"/>
  <text x="719" y="96" font-size="16" font-weight="bold">+</text>
  <text x="720" y="176" font-size="18" font-weight="bold">−</text>
    <text x="740" y="214" font-size="13" text-anchor="middle">StrongARM</text>
  <line x1="790" y1="252" x2="790" y2="144" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="798" y="250" font-size="12">clk</text>

  <!-- SAR logic -->
  <line x1="806" y1="130" x2="836" y2="130" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="838" y="96" width="122" height="68" rx="8" fill="#f3f6fb" stroke="#222" stroke-width="2"/>
  <text x="899" y="126" text-anchor="middle" font-weight="bold">SAR logic</text>
  <text x="899" y="146" text-anchor="middle" font-size="11" fill="#555">sky130 std cells</text>
  <line x1="930" y1="164" x2="930" y2="204" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="930" y="222" text-anchor="middle" font-size="13">code</text>
  <text x="930" y="240" text-anchor="middle" font-size="13">b<tspan baseline-shift="sub" font-size="9">N−1</tspan> … b<tspan baseline-shift="sub" font-size="9">0</tspan></text>

  <!-- control: bit decisions drive the bottom-plate switches -->
  <path d="M870 164 V352 H80 V190 H112" fill="none" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrc)"/>
  <text x="470" y="370" text-anchor="middle" font-size="13" fill="#7b3fa0">each decision sets its bit's bottom plate to V<tspan baseline-shift="sub" font-size="9">ref</tspan> (keep) or GND (clear), then the next bit is tried</text>

  <!-- the three phases -->
  <g font-size="13.5" fill="#222">
    <text x="30" y="412"><tspan font-weight="bold">1 Sample.</tspan> φ<tspan baseline-shift="sub" font-size="9">t</tspan> holds the top plate at V<tspan baseline-shift="sub" font-size="9">cm</tspan>; every bottom plate tracks the V<tspan baseline-shift="sub" font-size="9">in</tspan> pin (φ<tspan baseline-shift="sub" font-size="9">s</tspan>: MSB; φ<tspan baseline-shift="sub" font-size="9">g</tspan>: other bits and dummy, opened slightly later).</text>
    <text x="30" y="438"><tspan font-weight="bold">2 First trial.</tspan> φ<tspan baseline-shift="sub" font-size="9">t</tspan> opens first (bottom-plate sampling); the MSB goes to V<tspan baseline-shift="sub" font-size="9">ref</tspan>, the rest to GND:  V<tspan baseline-shift="sub" font-size="9">x</tspan> = V<tspan baseline-shift="sub" font-size="9">cm</tspan> + V<tspan baseline-shift="sub" font-size="9">ref</tspan>/2 − V<tspan baseline-shift="sub" font-size="9">in</tspan>.</text>
    <text x="30" y="464"><tspan font-weight="bold">3 Decide, N times.</tspan> The comparator gives the sign of V<tspan baseline-shift="sub" font-size="9">x</tspan> − V<tspan baseline-shift="sub" font-size="9">cm</tspan>; the logic keeps or clears the bit and tries the next one.</text>
    <text x="30" y="488" fill="#555" font-size="12.5">Charge conservation: V<tspan baseline-shift="sub" font-size="8">x</tspan> − V<tspan baseline-shift="sub" font-size="8">cm</tspan> = Σ b<tspan baseline-shift="sub" font-size="8">i</tspan>·(C<tspan baseline-shift="sub" font-size="8">i</tspan>/C<tspan baseline-shift="sub" font-size="8">tot</tspan>)·V<tspan baseline-shift="sub" font-size="8">ref</tspan> − V<tspan baseline-shift="sub" font-size="8">in</tspan>, so only its sign is needed; after N decisions the bits are the code of V<tspan baseline-shift="sub" font-size="8">in</tspan>.</text>
  </g>
</svg>
