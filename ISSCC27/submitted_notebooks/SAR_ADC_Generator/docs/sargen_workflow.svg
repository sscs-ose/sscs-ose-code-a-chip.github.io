<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5a6270"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>

  <text x="45" y="38" font-size="15" font-weight="bold" fill="#1f5fbf">Circuit design</text>
  <text x="45" y="243" font-size="15" font-weight="bold" fill="#2e7d32">Chip layout</text>

  <!-- row 1 -->
  <g stroke-width="1.5">
    <rect x="45" y="52" width="200" height="124" rx="12" fill="#eef4fc" stroke="#1f5fbf"/>
    <rect x="275" y="52" width="200" height="124" rx="12" fill="#eef4fc" stroke="#1f5fbf"/>
    <rect x="505" y="52" width="200" height="124" rx="12" fill="#eef4fc" stroke="#1f5fbf"/>
    <rect x="735" y="52" width="200" height="124" rx="12" fill="#eef4fc" stroke="#1f5fbf"/>
  </g>
  <!-- row 2 -->
  <g stroke-width="1.5">
    <rect x="735" y="257" width="200" height="124" rx="12" fill="#edf6ee" stroke="#2e7d32"/>
    <rect x="505" y="257" width="200" height="124" rx="12" fill="#edf6ee" stroke="#2e7d32"/>
    <rect x="275" y="257" width="200" height="124" rx="12" fill="#edf6ee" stroke="#2e7d32"/>
    <rect x="45" y="257" width="200" height="124" rx="12" fill="#fdf4dc" stroke="#b8860b" stroke-width="2.5"/>
  </g>

  <!-- arrows -->
  <g stroke="#5a6270" stroke-width="2.2" fill="none" marker-end="url(#a)">
    <line x1="247" y1="114" x2="272" y2="114"/>
    <line x1="477" y1="114" x2="502" y2="114"/>
    <line x1="707" y1="114" x2="732" y2="114"/>
    <line x1="835" y1="178" x2="835" y2="254"/>
    <line x1="733" y1="319" x2="708" y2="319"/>
    <line x1="503" y1="319" x2="478" y2="319"/>
    <line x1="273" y1="319" x2="248" y2="319"/>
  </g>

  <!-- number badges -->
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="69" cy="78" r="14" fill="#1f5fbf"/><text x="69" y="83">1</text>
    <circle cx="299" cy="78" r="14" fill="#1f5fbf"/><text x="299" y="83">2</text>
    <circle cx="529" cy="78" r="14" fill="#1f5fbf"/><text x="529" y="83">3</text>
    <circle cx="759" cy="78" r="14" fill="#1f5fbf"/><text x="759" y="83">4</text>
    <circle cx="759" cy="283" r="14" fill="#2e7d32"/><text x="759" y="288">5</text>
    <circle cx="529" cy="283" r="14" fill="#2e7d32"/><text x="529" y="288">6</text>
    <circle cx="299" cy="283" r="14" fill="#2e7d32"/><text x="299" y="288">7</text>
    <circle cx="69" cy="283" r="14" fill="#b8860b"/><text x="69" y="288">8</text>
  </g>

  <!-- titles -->
  <g font-size="15.5" font-weight="bold" fill="#1d2330">
    <text x="91" y="84">Ask for an ADC</text>
    <text x="321" y="84">Learn the process</text>
    <text x="551" y="84">Choose every size</text>
    <text x="781" y="84">Test in simulation</text>
    <text x="781" y="289">Draw the chip</text>
    <text x="551" y="289">Check the drawing</text>
    <text x="321" y="289">Test the drawing</text>
    <text x="91" y="289">Ready result</text>
  </g>

  <!-- plain-language descriptions -->
  <g font-size="13" fill="#2f3542">
    <text x="61" y="118">“8 bits, 10 million</text><text x="61" y="137">samples per second”</text>
    <text x="61" y="160" font-size="11.5" fill="#6b7280">4 to 8 bits, your sample rate</text>

    <text x="291" y="118">simulate the factory’s</text><text x="291" y="137">transistors and capacitors</text>
    <text x="291" y="160" font-size="11.5" fill="#6b7280">SKY130 PDK, ngspice</text>

    <text x="521" y="118">each from a written rule:</text><text x="521" y="137">accuracy, noise, speed</text>
    <text x="521" y="160" font-size="11.5" fill="#6b7280">every decision is logged</text>

    <text x="751" y="118">accuracy, hot and cold,</text><text x="751" y="137">chip-to-chip variation</text>
    <text x="751" y="160" font-size="11.5" fill="#6b7280">ENOB, INL/DNL, PVT, MC</text>

    <text x="751" y="323">code places and wires</text><text x="751" y="342">the foundry’s own parts</text>
    <text x="751" y="365" font-size="11.5" fill="#6b7280">PDK cells, LibreLane for logic</text>

    <text x="521" y="323">obeys every factory rule</text><text x="521" y="342">and matches the circuit</text>
    <text x="521" y="365" font-size="11.5" fill="#6b7280">DRC (KLayout, Magic), LVS</text>

    <text x="291" y="323">simulate again, now with</text><text x="291" y="342">the real wiring included</text>
    <text x="291" y="365" font-size="11.5" fill="#6b7280">extraction, post-layout sim</text>

    <text x="61" y="323">chip layout file, report</text><text x="61" y="342">and this explanation</text>
    <text x="61" y="365" font-size="11.5" fill="#6b7280">GDS, results, notebook</text>
  </g>

  <text x="490" y="421" font-size="14.5" text-anchor="middle" fill="#1d2330">Each step is checked before the next one starts. One generator builds every resolution, with no hand drawing.</text>
  <text x="490" y="446" font-size="12.5" text-anchor="middle" fill="#6b7280">Grey lines name the technical step behind each box. All tools are open source.</text>
</svg>
