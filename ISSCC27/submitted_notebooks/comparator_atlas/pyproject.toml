[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "comparator-atlas"
version = "0.1.0"
description = "Reproducible SKY130 dynamic-comparator failure maps and offset-trim experiments"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "matplotlib==3.10.3",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.7",
    "jupyterlab==4.4.3",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["comparator_atlas"]
