name: Verify Comparator Atlas entry

on:
  push:
    branches:
      - "verify/comparator-atlas-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python310-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENTRY: ISSCC27/submitted_notebooks/comparator_atlas
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ISSCC27/submitted_notebooks/comparator_atlas
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore the declared review environment
        run: python -m pip install -r "$ENTRY/requirements-review.txt"
      - name: Organizer notebook style and badge requirements
        run: |
          python -m nbqa flake8 --ignore=E402,E226 "$ENTRY/Comparator_Atlas.ipynb"
          grep colab-badge "$ENTRY/Comparator_Atlas.ipynb"
          grep colab-badge "$ENTRY/Comparator_Atlas.ipynb" | (! grep -v sscs-ose)
      - name: Measurement and evidence tests
        working-directory: ISSCC27/submitted_notebooks/comparator_atlas
        run: |
          python -m pytest -q tests presentation
          node --test tests/test_explorer.mjs tests/test_waveform_lab.mjs
      - name: Execute the complete reviewer notebook
        working-directory: ISSCC27/submitted_notebooks/comparator_atlas
        run: python -m pytest --nbmake --nbmake-timeout=600 Comparator_Atlas.ipynb
      - name: Verify public notebook-only download and runtime restart
        working-directory: ISSCC27/submitted_notebooks/comparator_atlas
        run: python scripts/verify_notebook_bootstrap.py --artifact public_bootstrap.json
      - name: Install a fresh native Linux SPICE tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version
      - name: Fresh transistor simulation, not just stored results
        working-directory: ISSCC27/submitted_notebooks/comparator_atlas
        run: |
          python -c "import entry_tools as e; result=e.live_spice_smoke(); print(result.to_string(index=False)); result.to_csv('linux_live_smoke.csv', index=False)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-python310-review
          path: |
            ISSCC27/submitted_notebooks/comparator_atlas/linux_live_smoke.csv
            ISSCC27/submitted_notebooks/comparator_atlas/public_bootstrap.json
          if-no-files-found: ignore
