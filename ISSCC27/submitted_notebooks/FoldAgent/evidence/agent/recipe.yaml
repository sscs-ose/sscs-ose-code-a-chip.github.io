version: 2
planner:
  framework: codex
  model: gpt-6.1-sol
parameters:
  design: design.specification
  specification: specification.csir
  acceptance: acceptance.plan
  constraints: implementation.constraints
  reference: rtl.snapshot
name: logic-folding-round1
tasks:
  rtl-implementation:
    role: rtl-designer
    display_group: rtl_hierarchy
    intent: 'Create P0, the frozen compute-only coarse split of the provided R RTL.

      Deliver one rtl/lb_feedback.sv containing lb_feedback (wire-only system), lb_l0
      and lb_l1.

      System instances MUST be named L0 and L1. Preserve every original external port
      and

      cycle-level behavior. Place all phy_* ports on lb_l0, all original non-phy ports
      on

      lb_l1. L1 forwards each host signal across a link_<original_name> port to L0;

      directions reverse relative to its package port, including link_clk and link_rst_n.

      L0 keeps its original host port names. No host bypass outside L1 is allowed.

      L0 keeps mapping/configuration, request/response state, four weight rows, input/output

      banks and all job/consume control. L1 keeps all 32 varying signed8x8 products,

      eight tile reductions and eight signed32 accumulators. Preserve 352 payload
      bytes.

      Exactly these compute ports cross: L0 outputs fold_x[31:0], fold_w[255:0],

      fold_start,fold_consume; L0 inputs fold_next[255:0]; L1 directions reverse.

      fold_start=start_job, fold_consume=consume. fold_x is the current 4-input slice;

      fold_w is the current weight row. fold_next returns accumulator+tile_sum combinationally,

      including the last tile result. No additional pipeline, serialization or reduced
      MACs.

      Keep reset synchronous. Preserve last-tile errors, independent response delays
      and

      all backpressure/repair semantics. No third block or extra wrapper state.

      Every one of the 725 functional links uses real TX sky130_fd_sc_hd__buf_4 and
      RX

      sky130_fd_sc_hd__buf_2 at the physical port, with keep/dont_touch cell attributes.

      Clock/reset must also have real connected cells and remain valid clock/reset
      paths.

      Use behavioral definitions of these library cells only under `ifndef SYNTHESIS
      for

      standalone Icarus simulation; synthesis reads the actual Liberty blackboxes
      first.

      Read spec/folding-spec.json and spec/contract.md, then make the minimum structural

      split of the current RTL. Do not alter any checker, spec or tool. Run quick
      lint/

      elaboration only; independent numerical/performance/physical Tasks are downstream.

      Document storage ownership, the cut and actual endpoint cells in

      docs/implementation/physical-change.md. Finish with the exact native output
      protocol.

      This Task owns P0/P1/P2 over its life; CURRENT authorization is P0 only, at
      most

      3 RTL Attempts. P1/P2 need subsequent user resume and captured physical feedback.

      '
    permission:
      read:
      - spec/**
      - rtl/**
      - chisel/**
      - integration/**
      - vendor/**
      - ip/**
      - .chip_nebula/ip-library/**
      - reports/physical-analysis/**
      - reports/baseline/**
      - reports/physical-l0/**
      - reports/physical-l1/**
      write:
      - rtl/**
      - chisel/**
      - build/rtl/**
      - docs/implementation/**
      tools:
      - git
      - make
      - python3
      - sbt
      - verilator
      - iverilog
      - yosys
    inputs:
      design:
        type: design.specification
        from: $parameters.design
      specification:
        type: specification.csir
        from: $parameters.specification
    outputs:
      rtl:
        type: rtl.snapshot
        paths:
        - rtl/**
        - chisel/**
        - build/rtl/**
        - docs/implementation/**
    gates:
    - name: synthesizable-rtl-present
      kind: file_check
      on_failure: retry
      parameters:
        paths:
        - rtl/**/*.sv
        - rtl/**/*.v
        - build/rtl/**/*.sv
        - build/rtl/**/*.v
        min_files: 1
        level: L1
        error_class: rtl_delivery_missing
    - name: split-rationale
      kind: file_check
      on_failure: retry
      parameters:
        paths:
        - docs/implementation/physical-change.md
        min_files: 1
        level: L1
    max_attempts: 9
    execution:
      framework: codex
      model: gpt-6.1-sol
      timeout_seconds: 1800
      reasoning_effort: medium
  full-design-integration:
    role: integration-engineer
    display_group: ip_assembly
    intent: Integrate the implemented RTL with the project's declared IP, memory,
      clock, reset and bus boundaries; deliver a reproducible elaborated top and dependency
      lock.
    permission:
      read:
      - spec/**
      - rtl/**
      - chisel/**
      - vendor/**
      - ip/**
      - integration/**
      - build/rtl/**
      - docs/implementation/**
      - physical/chip-nebula/**
      - .chip_nebula/ip-library/**
      - scripts/**
      - verif/**
      - project.json
      - reports/integration/**
      write:
      - rtl/integration/**
      - integration/**
      - build/integration/**
      - reports/integration/**
      tools:
      - git
      - make
      - python3
      - verilator
      - iverilog
      - yosys
    inputs:
      design:
        type: design.specification
        from: $parameters.design
      specification:
        type: specification.csir
        from: $parameters.specification
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
      rtl:
        type: rtl.snapshot
        from: $tasks.rtl-implementation.outputs.rtl
    outputs:
      integration:
        type: rtl.integration
        paths:
        - rtl/**
        - chisel/**
        - integration/**
        - build/integration/**
        - reports/integration/**
    max_attempts: 12
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages integrate
      timeout_seconds: 7200
  functional-performance-verify:
    role: functional-performance-verifier
    display_group: func_verify
    intent: Build maintainable verification sources and produce a credible functional,
      acceptance-coverage and cycle-performance report for the integrated design.
    permission:
      read:
      - spec/**
      - rtl/**
      - chisel/**
      - integration/**
      - build/integration/**
      - vendor/**
      - ip/**
      - verification/**
      - tb/**
      - tests/**
      - scripts/**
      - verif/**
      - project.json
      - reports/integration/**
      write:
      - verification/**
      - build/verify/**
      - build/perf/**
      - reports/verification/**
      - reports/performance/**
      tools:
      - git
      - make
      - python3
      - verilator
      - iverilog
      - vvp
    inputs:
      specification:
        type: specification.csir
        from: $parameters.specification
      acceptance:
        type: acceptance.plan
        from: $parameters.acceptance
      integration:
        type: rtl.integration
        from: $tasks.full-design-integration.outputs.integration
    outputs:
      environment:
        type: verification.environment
        schema_version: 3
        paths:
        - verification/**
        - tb/**
        - tests/**
      report:
        type: verification.report
        schema_version: 3
        paths:
        - reports/verification/**
        - reports/performance/**
    gates:
    - name: verification-result-summary
      template: result-summary
      version: 1
      on_failure: retry
      parameters:
        source: reports/verification/result_summary.json
        output: report
        profile: verification
        measured_metrics:
        - tests.total
        - tests.passed
        - tests.failed
        - acceptance.covered
        - acceptance.total
        error_class: verification_summary_invalid
    - name: engineering-verdict
      kind: report_verdict
      on_failure: feedback
      parameters:
        source: reports/verification/report.json
        level: L1
        error_class: verification_failed
    max_attempts: 12
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages verify
      timeout_seconds: 7200
  synthesize:
    role: logic-synthesizer
    display_group: logic_synthesis
    intent: Synthesize the released integrated RTL under the frozen implementation
      constraints and deliver a reproducible mapped netlist with closed pre-layout
      setup timing. Synthesize both real physical tops separately, retain endpoints
      and report their total area and minimum setup slack. Retain the synthesis setup
      gate; final setup/hold additionally requires joint STA.
    permission:
      read:
      - spec/**
      - rtl/**
      - chisel/**
      - integration/**
      - build/integration/**
      - vendor/**
      - ip/**
      - verification/**
      - reports/verification/**
      - reports/performance/**
      - build/synth/**
      - reports/synthesis/**
      - physical/chip-nebula/**
      - scripts/**
      - verif/**
      - project.json
      - reports/integration/**
      write:
      - build/synth/**
      - reports/synthesis/**
      tools:
      - git
      - make
      - python3
      - yosys
      - opensta
    inputs:
      integration:
        type: rtl.integration
        from: $tasks.full-design-integration.outputs.integration
      verification:
        type: verification.report
        from: $tasks.functional-performance-verify.outputs.report
        release:
          field: verdict
          equals: passed
      acceptance:
        type: acceptance.plan
        from: $parameters.acceptance
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
    outputs:
      netlist:
        type: netlist
        paths:
        - build/synth/**
        - reports/synthesis/**
    gates:
    - name: synthesis-result-summary
      template: result-summary
      version: 1
      on_failure: retry
      parameters:
        source: reports/synthesis/result_summary.json
        output: netlist
        profile: synthesis
        measured_metrics:
        - design.standard_cell_count
        - design.cell_area
        - design.macro_count
        error_class: synthesis_summary_invalid
    - name: setup-timing-closure
      kind: metric_check
      on_failure: retry
      parameters:
        source: reports/synthesis/result_summary.json
        metric: timing.setup_slack
        operator: '>='
        threshold: 0.0
        level: L1
        error_class: synthesis_timing_violation
    max_attempts: 12
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages synthesize
      timeout_seconds: 7200
  physical-l0:
    role: pnr-engineer
    intent: Run frozen short physical screen for L0; preserve real failures/checkpoints.
      A short screen is not final physical qualification. This fixed Task also owns
      later approved candidate screens and the selected full implementation; current
      P0 mode is short only, user review precedes later work.
    permission:
      read:
      - spec/**
      - build/synth/**
      - reports/synthesis/**
      - rtl/**
      write:
      - build/physical-l0/**
      - reports/physical-l0/**
      tools:
      - python3
      - make
      - openroad
      - yosys
      - klayout
    inputs:
      netlist:
        type: netlist
        from: $tasks.synthesize.outputs.netlist
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
    outputs:
      layout:
        type: layout
        paths:
        - build/physical-l0/**
        - reports/physical-l0/**
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages physical-l0
      timeout_seconds: 6000
    max_attempts: 12
  physical-l1:
    role: pnr-engineer
    intent: Run frozen short physical screen for L1; preserve real failures/checkpoints.
      A short screen is not final physical qualification. This fixed Task also owns
      later approved candidate screens and the selected full implementation; current
      P0 mode is short only, user review precedes later work.
    permission:
      read:
      - spec/**
      - build/synth/**
      - reports/synthesis/**
      - rtl/**
      write:
      - build/physical-l1/**
      - reports/physical-l1/**
      tools:
      - python3
      - make
      - openroad
      - yosys
      - klayout
    inputs:
      netlist:
        type: netlist
        from: $tasks.synthesize.outputs.netlist
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
    outputs:
      layout:
        type: layout
        paths:
        - build/physical-l1/**
        - reports/physical-l1/**
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages physical-l1
      timeout_seconds: 6000
    max_attempts: 12
  baseline-controls:
    role: physical-evidence-reviewer
    intent: Measure the same-condition S0/Sarea controls from the immutable R snapshot.
      Reuse exact checked functional evidence; rerun synthesis and physical conditions.
      Short screens now; selected final full controls only after user resume.
    permission:
      read:
      - spec/**
      - rtl/**
      write:
      - build/baseline/**
      - reports/baseline/**
      tools:
      - python3
      - make
      - openroad
      - yosys
      - klayout
    inputs:
      reference:
        type: rtl.snapshot
        from: $parameters.reference
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
    outputs:
      report:
        type: timing.report
        paths:
        - build/baseline/**
        - reports/baseline/**
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages baseline
      timeout_seconds: 14400
    max_attempts: 4
  physical-analysis:
    role: physical-evidence-reviewer
    intent: Aggregate actual L0/L1 checkpoints, spatial hotspots, connectivity and
      timing evidence. Preserve missing values. Produce the P0 feedback for later
      P1; do not generate P1.
    permission:
      read:
      - spec/**
      - build/**
      - reports/**
      - rtl/**
      write:
      - reports/physical-analysis/**
      tools:
      - python3
      - openroad
      - yosys
    inputs:
      l0:
        type: layout
        from: $tasks.physical-l0.outputs.layout
      l1:
        type: layout
        from: $tasks.physical-l1.outputs.layout
      netlist:
        type: netlist
        from: $tasks.synthesize.outputs.netlist
      constraints:
        type: implementation.constraints
        from: $parameters.constraints
      baseline:
        type: timing.report
        from: $tasks.baseline-controls.outputs.report
    outputs:
      report:
        type: timing.report
        paths:
        - reports/physical-analysis/**
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages analyze
      timeout_seconds: 1200
    max_attempts: 6
  independent-acceptance:
    role: physical-evidence-reviewer
    intent: Audit the complete P0 checkpoint and report functional/performance pass
      separately from physical qualification. Stop after P0 and report actual native
      model usage; no automatic P1/P2.
    permission:
      read:
      - spec/**
      - reports/**
      - build/**
      write:
      - reports/checkpoint/**
      tools:
      - python3
    inputs:
      physical:
        type: timing.report
        from: $tasks.physical-analysis.outputs.report
      verification:
        type: verification.report
        from: $tasks.functional-performance-verify.outputs.report
      acceptance:
        type: acceptance.plan
        from: $parameters.acceptance
    outputs:
      report:
        type: timing.report
        paths:
        - reports/checkpoint/**
    execution:
      executor: tool
      command: python3 -m chip_nebula.taskgraph.logic_folding_stages checkpoint
      timeout_seconds: 600
    max_attempts: 6
feedback:
- source: physical-analysis
  verdict: pass
  target: rtl-implementation
  kind: feedback
  summary: Revise the current candidate using its captured two-die physical feedback
    and baseline control evidence; preserve all frozen gates.
  when:
    field: report.feedback_resume_authorized
    equals: true
  propagate: true
- source: physical-analysis
  verdict: fail
  target: rtl-implementation
  kind: feedback
  summary: Revise the current candidate using its captured two-die physical feedback
    and baseline control evidence; preserve all frozen gates.
  when:
    field: report.feedback_resume_authorized
    equals: true
  propagate: true
- source: functional-performance-verify
  verdict: fail
  target: rtl-implementation
  kind: feedback
  summary: Repair the independently measured P0 functional or throughput defect within
    the same fixed split; do not modify the checker or consume a new physical candidate.
  propagate: true
