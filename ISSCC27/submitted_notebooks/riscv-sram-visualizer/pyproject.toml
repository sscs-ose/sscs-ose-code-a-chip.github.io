[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "riscv-memory-visualizer"
version = "0.1.0"
authors = [{name = "Fiza Khalid"}, {name = "Dayem Mujahid"}]
license = "Apache-2.0"
license-files = ["LICENSE"]

description = "Manual, scene-by-scene 6T SRAM teaching visualizer backed by a RISC-V memory model."
readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "matplotlib>=3.7",
    "ipywidgets>=8",
    "ipython>=8"
]

[project.optional-dependencies]
notebook = ["notebook>=7", "ipykernel>=6", "nbformat>=5.7", "nbclient>=0.8"]
test = ["pytest>=7"]


[tool.setuptools.packages.find]
where = ["src"]
