<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Address decode" style="width:100%;height:100%;background:#f8fafc;border-radius:18px"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e89428"/></marker></defs><style>@keyframes teaching-glow{0%{opacity:0;stroke-width:2}45%{opacity:1;stroke-width:8}100%{opacity:.65;stroke-width:4}}@keyframes teaching-selected{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes sram-reveal{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.teaching-glow{fill:none;stroke:#f2a12a;stroke-width:4;opacity:0;filter:drop-shadow(0 0 5px #f7b94e);animation:teaching-glow .52s ease-out forwards;pointer-events:none}.teaching-selected{transform-box:fill-box;transform-origin:center;animation:teaching-selected .55s ease-out 1.1s both}.sram-reveal{transform-box:fill-box;transform-origin:center;animation:sram-reveal .45s ease-out both}@media(prefers-reduced-motion:reduce){.teaching-glow{animation:none!important;opacity:.65}.sram-reveal,.teaching-selected{animation:none!important}}</style><text x="480" y="65" text-anchor="middle" fill="#17233a" font-size="27" font-family="system-ui, sans-serif" font-weight="650">ADDRESS DECODE</text><g id="address-input" class="schematic-input"><circle cx="132" cy="252" r="19" fill="white" stroke="#d28721" stroke-width="3"/><polyline points="151,252 210,252" fill="none" stroke="#d28721" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="258" text-anchor="middle" fill="#9d6114" font-size="14" font-family="system-ui, sans-serif" font-weight="650">A</text><text x="180" y="236" text-anchor="middle" fill="#17233a" font-size="15" font-family="system-ui, sans-serif" font-weight="650">0x08</text></g><g id="row-decoder" class="schematic-decoder"><polygon points="385,132 561,120 595,175.0 561,230 385,218" fill="#f4efff" stroke="#7951bb" stroke-width="3"/><text x="482.0" y="180.0" text-anchor="middle" fill="#62409c" font-size="17" font-family="system-ui, sans-serif" font-weight="650">ROW 0</text><path d="M595 159.0 H610 M595 191.0 H610" fill="none" stroke="#7951bb" stroke-width="3"/></g><g id="column-selector" class="schematic-selector"><polygon points="385,315 565,330 595,370.0 565,410 385,425" fill="#eaf9fa" stroke="#0f9aa7" stroke-width="3"/><text x="485.0" y="375.0" text-anchor="middle" fill="#087e89" font-size="16" font-family="system-ui, sans-serif" font-weight="650">COLUMN 2</text><text x="485.0" y="408" text-anchor="middle" fill="#087e89" font-size="12" font-family="system-ui, sans-serif" font-weight="650">SEL</text></g><g id="selected-cell"><g id="cell-r0-c2" class="schematic-array-cell"><rect x="740" y="223" width="100" height="65" rx="8" fill="white" stroke="#db6f24" stroke-width="3"/><text x="790.0" y="263.5" text-anchor="middle" fill="#16855d" font-size="24" font-family="system-ui, sans-serif" font-weight="650">1</text></g></g><text x="790" y="207" text-anchor="middle" fill="#a85213" font-size="17" font-family="system-ui, sans-serif" font-weight="650">CELL (0,2)</text><path d="M300 250 L375 175" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 265 L375 365" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><path d="M605 175 L695 245" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><path d="M605 370 L695 280" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="449" text-anchor="middle" fill="#17233a" font-size="18" font-family="system-ui, sans-serif" font-weight="650">0x08 = 8; index = 8 // 4 = 2</text><text x="480" y="480" text-anchor="middle" fill="#17233a" font-size="18" font-family="system-ui, sans-serif" font-weight="650">row = 2 // 4 = 0; column = 2 % 4 = 2</text><g data-animation-sequence="address-input,row-decoder,column-selector,selected-cell"><rect id="glow-address-input" data-target="address-input" data-order="0" class="teaching-glow teaching-glow-delay-0" x="110" y="223" width="105" height="58" rx="9" style="animation-delay:0.00s"/><rect id="glow-row-decoder" data-target="row-decoder" data-order="1" class="teaching-glow teaching-glow-delay-1" x="385" y="120" width="210" height="110" rx="9" style="animation-delay:0.55s"/><rect id="glow-column-selector" data-target="column-selector" data-order="2" class="teaching-glow teaching-glow-delay-2" x="385" y="315" width="210" height="110" rx="9" style="animation-delay:1.10s"/><rect id="glow-selected-cell" data-target="selected-cell" data-order="3" class="teaching-glow teaching-glow-delay-3" x="740" y="223" width="100" height="65" rx="9" style="animation-delay:1.65s"/></g></svg>