<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Inside the SRAM macro" style="width:100%;height:100%;background:#f8fafc;border-radius:18px"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e89428"/></marker></defs><style>@keyframes teaching-glow{0%{opacity:0;stroke-width:2}45%{opacity:1;stroke-width:8}100%{opacity:.65;stroke-width:4}}@keyframes teaching-selected{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes sram-reveal{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.teaching-glow{fill:none;stroke:#f2a12a;stroke-width:4;opacity:0;filter:drop-shadow(0 0 5px #f7b94e);animation:teaching-glow .52s ease-out forwards;pointer-events:none}.teaching-selected{transform-box:fill-box;transform-origin:center;animation:teaching-selected .55s ease-out 1.1s both}.sram-reveal{transform-box:fill-box;transform-origin:center;animation:sram-reveal .45s ease-out both}@media(prefers-reduced-motion:reduce){.teaching-glow{animation:none!important;opacity:.65}.sram-reveal,.teaching-selected{animation:none!important}}</style><text x="480" y="65" text-anchor="middle" fill="#17233a" font-size="27" font-family="system-ui, sans-serif" font-weight="650">INSIDE THE SRAM MACRO</text><g id="address-input" class="schematic-input"><circle cx="117" cy="231" r="19" fill="white" stroke="#d28721" stroke-width="3"/><polyline points="136,231 195,231" fill="none" stroke="#d28721" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="237" text-anchor="middle" fill="#9d6114" font-size="14" font-family="system-ui, sans-serif" font-weight="650">A</text><text x="165" y="215" text-anchor="middle" fill="#17233a" font-size="15" font-family="system-ui, sans-serif" font-weight="650">0x08</text></g><g id="row-decoder" class="schematic-decoder"><polygon points="310,122 466,110 500,165.0 466,220 310,208" fill=