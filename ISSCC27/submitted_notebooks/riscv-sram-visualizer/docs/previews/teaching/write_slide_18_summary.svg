<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Write summary" style="width:100%;height:100%;background:#f8fafc;border-radius:18px"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e89428"/></marker></defs><style>@keyframes teaching-glow{0%{opacity:0;stroke-width:2}45%{opacity:1;stroke-width:8}100%{opacity:.65;stroke-width:4}}@keyframes teaching-selected{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes sram-reveal{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.teaching-glow{fill:none;stroke:#f2a12a;stroke-width:4;opacity:0;filter:drop-shadow(0 0 5px #f7b94e);animation:teaching-glow .52s ease-out forwards;pointer-events:none}.teaching-selected{transform-box:fill-box;transform-origin:center;animation:teaching-selected .55s ease-out 1.1s both}.sram-reveal{transform-box:fill-box;transform-origin:center;animation:sram-reveal .45s ease-out both}@media(prefers-reduced-motion:reduce){.teaching-glow{animation:none!important;opacity:.65}.sram-reveal,.teaching-selected{animation:none!important}}</style><text x="480" y="65" text-anchor="middle" fill="#17233a" font-size="27" font-family="system-ui, sans-serif" font-weight="650">WRITE SUMMARY</text><g id="summary-decode"><rect x="45" y="220" width="130" height="90" rx="12" fill="white" stroke="#7951bb" stroke-width="3"/><text x="110.0" y="266.0" text-anchor="middle" fill="#7951bb" font-size="14" font-family="system-ui, sans-serif" font-weight="650">DECODE</text></g><path d="M177 265 L195 265" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><g id="summary-select"><rect x="198" y="220" width="130" height="90" rx="12" fill="white" stroke="#7951bb" stroke-width="3"/><text x="263.0" y="266.0" text-anchor="middle" fill="#7951bb" font-size="14" font-family="system-ui, sans-serif" font-weight="650">SELECT CELL</text></g><path d="M330 265 L348 265" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><g id="summary-prepare"><rect x="351" y="220" width="130" height="90" rx="12" fill="white" stroke="#7951bb" stroke-width="3"/><text x="416.0" y="266.0" text-anchor="middle" fill="#7951bb" font-size="14" font-family="system-ui, sans-serif" font-weight="650">DRIVE BL</text></g><path d="M483 265 L501 265" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><g id="summary-access"><rect x="504" y="220" width="130" height="90" rx="12" fill="white" stroke="#0f9aa7" stroke-width="3"/><text x="569.0" y="266.0" text-anchor="middle" fill="#0f9aa7" font-size="14" font-family="system-ui, sans-serif" font-weight="650">WL ON</text></g><path d="M636 265 L654 265" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><g id="summary-finish"><rect x="657" y="220" width="130" height="90" rx="12" fill="white" stroke="#0f9aa7" stroke-width="3"/><text x="722.0" y="266.0" text-anchor="middle" fill="#0f9aa7" font-size="14" font-family="system-ui, sans-serif" font-weight="650">OVERWRITE</text></g><path d="M789 265 L807 265" fill="none" stroke="#e89428" stroke-width="4" marker-end="url(#arrow)"/><g id="summary-result"><rect x="810" y="220" width="130" height="90" rx="12" fill="white" stroke="#0f9aa7" stroke-width="3"/><text x="875.0" y="266.0" text-anchor="middle" fill="#0f9aa7" font-size="14" font-family="system-ui, sans-serif" font-weight="650">STORED 1</text></g><g data-animation-sequence="summary-decode,summary-select,summary-prepare,summary-access,summary-finish,summary-result"><rect id="glow-summary-decode" data-target="summary-decode" data-order="0" class="teaching-glow teaching-glow-delay-0" x="45" y="220" width="130" height="90" rx="9" style="animation-delay:0.00s"/><rect id="glow-summary-select" data-target="summary-select" data-order="1" class="teaching-glow teaching-glow-delay-1" x="198" y="220" width="130" height="90" rx="9" style="animation-delay:0.55s"/><rect id="glow-summary-prepare" data-target="summary-prepare" data-order="2" class="teaching-glow teaching-glow-delay-2" x="351" y="220" width="130" height="90" rx="9" style="animation-delay:1.10s"/><rect id="glow-summary-access" data-target="summary-access" data-order="3" class="teaching-glow teaching-glow-delay-3" x="504" y="220" width="130" height="90" rx="9" style="animation-delay:1.65s"/><rect id="glow-summary-finish" data-target="summary-finish" data-order="4" class="teaching-glow teaching-glow-delay-4" x="657" y="220" width="130" height="90" rx="9" style="animation-delay:2.20s"/><rect id="glow-summary-result" data-target="summary-result" data-order="5" class="teaching-glow teaching-glow-delay-5" x="810" y="220" width="130" height="90" rx="9" style="animation-delay:2.75s"/></g></svg>