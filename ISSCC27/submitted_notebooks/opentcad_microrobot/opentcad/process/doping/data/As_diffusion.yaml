# Intrinsic diffusivity of arsenic in silicon.
#
# Source: Fair, "Concentration-Dependent Diffusion of Dopants in Silicon"
#         (1981); Plummer, Silicon VLSI Technology, Table 7.2.
#
# Arsenic is the slowest-diffusing common Si dopant — a factor of ~3-5
# below phosphorus at the same T. That's why n+ S/D is almost universally
# arsenic in modern CMOS: the sharp as-implanted profile stays sharp
# after anneal. Fair's model for As:
#     D = D_i + D_minus * (n / n_i)

species: arsenic
symbol: As
target: Si
dopant_kind: donor

intrinsic:
  D0_cm2s: 0.066       # [cm² / s]
  Ea_eV:   3.44        # [eV]

# Fair concentration-dependent coefficients — placeholders.
fair:
  D_minus:
    D0_cm2s: 12.0
    Ea_eV:   4.05
