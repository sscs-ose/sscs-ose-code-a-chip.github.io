# Pearson-IV implant moments for phosphorus in silicon.
#
# Source: Sze & Ng, Physics of Semiconductor Devices, 3rd ed., Table 14.4;
#         cross-checked against Plummer, Silicon VLSI Technology, ch. 8.
# Amorphous target, no channeling correction.
#
# Notes:
#   - Phosphorus is much heavier than boron (mass ratio ~2.8), so Rp at
#     the same energy is ~3-4x shallower than boron.
#   - Skew is strongly positive at low energies (peak biased toward the
#     surface, long tail into the substrate) — typical of medium-mass ions.

species: phosphorus
symbol: P
target: Si
dopant_kind: donor
moments:
  -  {energy_keV:  10, Rp_um: 0.014, dRp_um: 0.006, gamma: 0.85, beta: 4.50}
  -  {energy_keV:  30, Rp_um: 0.038, dRp_um: 0.017, gamma: 0.70, beta: 4.00}
  -  {energy_keV:  50, Rp_um: 0.062, dRp_um: 0.026, gamma: 0.60, beta: 3.80}
  -  {energy_keV:  70, Rp_um: 0.087, dRp_um: 0.033, gamma: 0.50, beta: 3.60}
  -  {energy_keV: 100, Rp_um: 0.124, dRp_um: 0.043, gamma: 0.40, beta: 3.40}
  -  {energy_keV: 150, Rp_um: 0.185, dRp_um: 0.058, gamma: 0.30, beta: 3.20}
  -  {energy_keV: 200, Rp_um: 0.246, dRp_um: 0.070, gamma: 0.25, beta: 3.00}
