# Pearson-IV implant moments for arsenic in silicon.
#
# Source: Sze & Ng, Physics of Semiconductor Devices, 3rd ed., Table 14.4;
#         cross-checked against Plummer, Silicon VLSI Technology, ch. 8.
# Amorphous target, no channeling correction.
#
# Notes:
#   - Arsenic is one of the heaviest common Si dopants (mass 75). Rp at
#     100 keV is only ~70 nm — perfect for shallow n+ S/D contacts.
#   - Very asymmetric profiles: gamma ~1 typically, kurtosis 4-6. A
#     Gaussian approximation understates the tail concentration by
#     roughly 2x-3x at 2*dRp depth.

species: arsenic
symbol: As
target: Si
dopant_kind: donor
moments:
  -  {energy_keV:  10, Rp_um: 0.008, dRp_um: 0.003, gamma: 1.50, beta: 6.00}
  -  {energy_keV:  30, Rp_um: 0.022, dRp_um: 0.009, gamma: 1.20, beta: 5.50}
  -  {energy_keV:  50, Rp_um: 0.036, dRp_um: 0.014, gamma: 1.00, beta: 5.00}
  -  {energy_keV:  70, Rp_um: 0.050, dRp_um: 0.019, gamma: 0.90, beta: 4.70}
  -  {energy_keV: 100, Rp_um: 0.070, dRp_um: 0.026, gamma: 0.80, beta: 4.40}
  -  {energy_keV: 150, Rp_um: 0.104, dRp_um: 0.036, gamma: 0.70, beta: 4.20}
  -  {energy_keV: 200, Rp_um: 0.135, dRp_um: 0.046, gamma: 0.60, beta: 4.00}
