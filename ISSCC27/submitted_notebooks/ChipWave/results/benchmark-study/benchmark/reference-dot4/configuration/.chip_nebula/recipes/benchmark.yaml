name: benchmark-generation
version: 2
parameters:
  source: specification.source
tasks:
  designer:
    role: benchmark-designer
    intent: 'Read spec/task.md, interface.json and the typed CSIR behavioral contract.

      Implement the exact top-level interface and all behavior in rtl/. Develop with

      python3 tools/check.py and optional tests/designer/. Write only rtl/, tests/designer/

      and build/. Do not modify the task, checker, workflow or permissions, inspect

      other trials or final evaluators, or invoke extra models/agents. Repair actionable

      feedback within the shared 1200-second frontend budget. Return

      NEBULA_OUTPUT: {"rtl":{"module":"the exact requested top-level module"}}.

      '
    permission:
      read:
      - spec/**
      - rtl/**
      - tb/**
      - tools/**
      - tests/**
      - reports/**
      - build/**
      write:
      - rtl/**
      - tests/designer/**
      - build/**
      tools:
      - python3
      - iverilog
      - vvp
      - verilator
      - git
      - make
    inputs:
      source: &id001
        type: specification.source
        from: $parameters.source
    outputs:
      rtl:
        type: rtl.snapshot
        paths:
        - rtl/**
    execution: &id002
      framework: codex
      model: gpt-6.1-sol
      reasoning_effort: high
      timeout_seconds: 1200
    max_attempts: 8
  verifier:
    role: benchmark-verifier
    intent: 'Independently inspect and test delivered RTL against spec/task.md and

      interface.json. Run python3 tools/check.py; add focused boundary/reset/protocol

      tests under tests/reviewer/ if useful. Do not change RTL, task or public checker,

      read other projects/final evaluators, or invoke extra models/agents. Your time

      shares the original 1200-second frontend budget with the designer. Write

      reports/review.json and return NEBULA_OUTPUT: {"report":{"subject":"benchmark-rtl",

      "verdict":"passed or failed","repair_summary":"concrete findings"}}.

      Use an actual verdict. Failed findings go back to the original designer.

      '
    permission:
      read:
      - spec/**
      - rtl/**
      - tb/**
      - tools/**
      - tests/**
      - reports/**
      - build/**
      write:
      - tests/reviewer/**
      - reports/**
      - build/**
      tools:
      - python3
      - iverilog
      - vvp
      - verilator
      - git
      - make
    inputs:
      source: *id001
      rtl: &id003
        type: rtl.snapshot
        from: $tasks.designer.outputs.rtl
    outputs:
      report:
        type: verification.report
        paths:
        - reports/**
        - tests/reviewer/**
    execution: *id002
    max_attempts: 8
  audit:
    role: benchmark-auditor
    intent: Replay the unchanged public checker.
    permission:
      read:
      - spec/**
      - rtl/**
      - tb/**
      - tools/**
      - tests/**
      - reports/**
      - build/**
      write:
      - build/**
      tools:
      - python3
      - iverilog
      - vvp
      - verilator
      - git
      - make
    inputs:
      rtl: *id003
      review:
        type: verification.report
        from: $tasks.verifier.outputs.report
        release:
          field: verdict
          equals: passed
    outputs:
      report:
        type: verification.report
        paths:
        - build/smoke/**
    execution:
      executor: tool
      command: python3 tools/check.py
      timeout_seconds: 120
    max_attempts: 8
feedback:
- source: verifier
  verdict: fail
  target: designer
  kind: feedback
  propagate: true
  summary: Repair the reported task defect.
  summary_field: report.repair_summary
- source: audit
  verdict: fail
  target: designer
  kind: feedback
  propagate: true
  summary: Repair the reported task defect.
  summary_field: report.repair_summary
