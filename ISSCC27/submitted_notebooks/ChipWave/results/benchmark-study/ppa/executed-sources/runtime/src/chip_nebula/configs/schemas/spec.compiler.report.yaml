type: spec.compiler.report
version: 1
required_fields:
  subject: str
  bundle_artifact_id: str
  verdict: str
  review_artifact_id: str
  spec_revision_id: str
  failure_kind:
    type: str
    description: 编译成功且无未决项时为空；诊断待裁决时为 needs_decision；CSIR 无法解析时为 needs_repair
  diagnostics: list
  questions: list
  open_question_count: int
  counts: dict
  signoff: dict
  input_digests: list
