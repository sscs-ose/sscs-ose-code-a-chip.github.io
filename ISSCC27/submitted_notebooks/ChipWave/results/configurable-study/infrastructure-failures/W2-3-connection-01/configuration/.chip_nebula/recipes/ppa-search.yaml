name: bounded-ppa-search
version: 2
parameters:
  source: specification.source
tasks:
  proposer:
    role: ppa-proposer
    intent: 'You are the PPA implementation optimizer for one frozen CPU+NPU.

      Read context/baseline.json and context/protocol.json. Inspect the immutable

      feedback evaluation report/history before every subsequent proposal. Choose

      one previously untried tuple in the frozen parameter domain. The circuit RTL,

      clock, libraries and acceptance thresholds cannot change. No extra EDA calls,

      screening searches, models or agents are allowed. Only the independent tool

      evaluator executes hardware implementation. Explain the decision using the

      actual available reports, and minimize the qualified area-times-energy score.

      Write proposal/candidate.json containing exactly configuration (the four

      parameter keys) and rationale (string). Write only proposal/ and optional

      build/ notes. End with NEBULA_OUTPUT: {"candidate":{"configuration":{...},

      "rationale":"your report-grounded explanation"}} with matching file/payload.

      After review rejection, repair this proposal without changing permissions.

      There are at most three new physical candidates and all AI roles together

      have 1200 seconds; EDA waiting is outside that agent budget.

      '
    permission:
      read:
      - context/**
      - proposal/**
      - reports/**
      - tools/**
      - build/**
      write:
      - proposal/**
      - build/**
      tools: &id001
      - python3
      - git
    inputs:
      source: &id002
        type: specification.source
        from: $parameters.source
    outputs:
      candidate:
        type: ppa.candidate
        paths:
        - proposal/**
    execution:
      framework: codex
      model: gpt-6.1-sol
      reasoning_effort: high
      timeout_seconds: 1200
    max_attempts: 12
    gates:
    - name: bounded-unseen-candidate
      template: script-check
      version: 1
      on_failure: retry
      parameters:
        script: python3
        arguments:
        - tools/run_ppa.py
        - validate
        expected: PPA_CANDIDATE_VALID
        timeout: 30
        level: L1
        error_class: invalid_ppa_candidate
  reviewer:
    role: ppa-verifier
    intent: 'Independently review this PPA proposal against context/protocol.json,

      the common baseline, and captured candidate/evaluation artifacts under

      .nebula_inputs/. Check its exact parameter tuple, previous trials in this

      session, interpretation of actual timing/electrical/power evidence, and that

      it preserves frozen RTL, constraints and acceptance. Do not invent results

      or run EDA/model calls. Reject an invalid or unsupported proposal with

      actionable feedback; otherwise permit the experiment to measure it. The

      optimizer alone owns proposal changes. Write only reports/review.json and

      optional build/ notes. Return NEBULA_OUTPUT: {"report":{"subject":"candidate",

      "verdict":"passed or failed","repair_summary":"concrete explanation"}}.

      Select one real verdict, never the placeholder string. Your time and Tokens

      are part of the same 1200-second budget as the optimizer.

      '
    permission:
      read:
      - context/**
      - proposal/**
      - reports/**
      - build/**
      write:
      - reports/**
      - build/**
      tools: *id001
    inputs:
      source: *id002
      candidate: &id003
        type: ppa.candidate
        from: $tasks.proposer.outputs.candidate
    outputs:
      report:
        type: verification.report
        paths:
        - reports/**
    execution:
      framework: codex
      model: gpt-6.1-sol
      reasoning_effort: high
      timeout_seconds: 1200
    max_attempts: 12
  evaluator:
    role: ppa-evaluator
    intent: Execute the captured immutable candidate under the protected physical
      budget.
    permission:
      read:
      - context/**
      - proposal/**
      - reports/**
      - tools/**
      - build/**
      write:
      - build/**
      tools: *id001
    inputs:
      candidate: *id003
      review:
        type: verification.report
        from: $tasks.reviewer.outputs.report
        release:
          field: verdict
          equals: passed
    outputs:
      report:
        type: ppa.evaluation.report
        paths:
        - build/evaluation/**
    execution:
      executor: tool
      command: python3 tools/run_ppa.py evaluate
      timeout_seconds: 16500
    max_attempts: 3
  finalizer:
    role: ppa-finalizer
    intent: Record search completion and retain the best qualified result, if any.
    on_demand: true
    permission:
      read:
      - tools/**
      - build/**
      write:
      - build/session/**
      tools: *id001
    inputs:
      evaluation:
        type: ppa.evaluation.report
        from: $tasks.evaluator.outputs.report
    outputs:
      report:
        type: ppa.session.report
        paths:
        - build/session/**
    execution:
      executor: tool
      command: python3 tools/run_ppa.py finalize
      timeout_seconds: 30
    max_attempts: 1
feedback:
- source: reviewer
  verdict: fail
  target: proposer
  kind: feedback
  summary: Repair the rejected PPA proposal.
  summary_field: report.repair_summary
  propagate: true
- source: evaluator
  verdict: pass
  target: proposer
  kind: feedback
  summary: Continue bounded search.
  propagate: true
  when:
    field: report.continue_search
    equals: true
- source: evaluator
  verdict: pass
  target: finalizer
  kind: feedback
  summary: Record terminal search observations.
  propagate: false
  when:
    field: report.continue_search
    equals: false
- source: evaluator
  verdict: fail
  target: proposer
  kind: feedback
  summary: Continue bounded search.
  propagate: true
  when:
    field: report.continue_search
    equals: true
- source: evaluator
  verdict: fail
  target: finalizer
  kind: feedback
  summary: Record terminal search observations.
  propagate: false
  when:
    field: report.continue_search
    equals: false
