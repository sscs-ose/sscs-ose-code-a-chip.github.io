      title: Check real pipeline and architectural resource scope
      detail: 'Responsible stage: rtl-implementation. Configuration: both core configurations.
        Dependencies: AC-INTEGRATION. Procedure: RTL implementation owner supplies
        source/state-transfer inventory showing four distinct interstage register
        groups; verify the RTL32x32RF with2 combinational reads/1 rising-edge write;
        mapped-netlist confirmation belongs to AC-SYNTHESIS after functional acceptance.
        Run observable timing/hazard/flush/wait/differential checks independently.
        Pass condition: Real IF/ID,ID/EX,EX/MEM,MEM/WB and single-issue pipeline in
        both configurations, not a multicycle controller or delayed commit. Enabled
        NPU appears in explicit generate; disabled hierarchy has no NPU multiplier.
        No CPU M divider/multiplier,predictor,cache,internal program/data RAM or OS.
        Exact base timing passes. Static structure review earns no extra scoring points;
        any future automatic scoring rule requires published decidable rules and false-positive
        regression before freeze. Evidence: State/transfer inventory, source-to-netlist
        mapping, RTL elaboration hierarchy and separate external timing reports; later
