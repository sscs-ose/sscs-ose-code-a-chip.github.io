  - key: timing-electrical
    title: Timing Electrical
    items:
    - id: AC-POSTROUTE-STA
      title: Close extracted propagated-clock TT timing
      detail: 'Responsible stage: pnr. Configuration: enabled physical top. Dependencies:
        AC-PDN-ROUTING. Procedure: After CTS read frozen SDC then set_propagated_clock
        nebula_clock; extract actual final ODB with manifest setRC.tcl/rcx_patterns.rules.
        Analyze setup/hold using final functional netlist and matched SPEF,TTLiberty
        and every required endpoint. Pass condition: Setup/hold slack>=0ns at100ns,uncertainties0.1retained,source
        latency0 and CTS delay not double-counted. Early/lateR,Cand timingderates1.0,no
        invented corners or timing exception; observer/reset checks retained. CTS
        uses only approved clkbuf1/2/4/8/16; report actual skew/insertion with no
        extra ceiling. Nominal single-corner engineering result only. Evidence: Final
        ODB/netlist/SPEF/SDC/library hashes,CTS and path reports,unconstrained-path
        audit and reports/pnr/result_summary.json measured timing.setup_slack/timing.hold_slack.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
      - REQ-B3136724E4AB
      - REQ-17C25DACF539
      - REQ-68A4C372A16F
      design_groups:
      - physical.scope
      responsible_stage: pnr
      dependencies:
      - AC-PDN-ROUTING
      source_refs:
      - physical/chip-nebula/implementation.constraints.json#/clocks
      - physical/chip-nebula/implementation.constraints.json#/cts
      - physical/chip-nebula/implementation.constraints.json#/rc
      execution_status: not_run
    - id: AC-ELECTRICAL
      title: Close characterized electrical and reset checks
      detail: 'Responsible stage: pnr; functional-performance-verify. Configuration:
        enabled physical top. Dependencies: AC-POSTROUTE-STA, AC-RESET, AC-NPU-CANCEL.
        Procedure: Analyze all actual clock/data/observer/reset nets for characterized
        slew/capacitance/fanout limits; run recovery/removal/library pulse-width checks
        with propagated clock. Independently inspect external reset waveform. Pass
        condition: Slew/capacitance violations0; available library fanout violations0,where
        no characterized ceiling report structural fanout and limit unavailable. Recovery/removal/library
        pulse checks pass; external reset low>=200ns,deassert49..51ns afterclk rise
        incl+/-1ns skew (do not expand window),joint memory reset. No blanket reset
        false path or invented assertion phase/synchronizer; async assertion retained.
        Structural fixture loading SDC is not actual design STA closure. Evidence:
        Actual electrical violation reports,reset recovery/removal/min-pulse paths
        and environment waveform measurements. V2 evidence requirement: Rerun/revalidate
        these checks against the new confirmed/frozen plan, frozen constraints revision
        2 and actual selected 4a7cf/2-thread physical inputs. Provide an actual reset-environment
        waveform linked to those formal inputs, independently measuring low pulse
        >=200 ns, release 49..51 ns including bounded skew and joint memory reset;
        historical absence or a fixture/read-only audit is not PASS. Retain the exact
        recovery/removal/library-pulse and every electrical threshold above.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
      - REQ-B3136724E4AB
      - REQ-17C25DACF539
      - REQ-68A4C372A16F
      - REQ-D78B93943C97
      - REQ-6C39607BFF86
      - REQ-079A812CDD10
      - REQ-47B47DDA5109
      - REQ-4187B6DAEA66
      design_groups:
      - physical.scope
      - cpu.reset
      - npu.cancel
      responsible_stage: pnr; functional-performance-verify
      dependencies:
      - AC-POSTROUTE-STA
      - AC-RESET
      - AC-NPU-CANCEL
      source_refs:
      - physical/chip-nebula/implementation.constraints.json#/electrical
      - physical/chip-nebula/implementation.constraints.json#/reset
      - physical/chip-nebula/implementation.constraints.json#/physical_qualification/reset
      execution_status: not_run
  - key: physical-signoff
    title: Physical Signoff
    items:
    - id: AC-ROUTE-CLEAN
      title: Clear detailed routing DRC and antenna
      detail: 'Responsible stage: pnr. Configuration: enabled physical top. Dependencies:
        AC-ELECTRICAL. Procedure: Run final detailed-route connectivity/DRC and antenna
        checks after all repairs using frozen allowed cells/rules; invalidate and
        rerun STA/export checks if repair changes design. Pass condition: RouterDRC
        violations0,antenna violations0,no unrouted functional net; actual final revision
        corresponds to timing/electrical evidence. Required execution_status records
        completed tool runs,not mere file existence. Evidence: Final router/antenna/connectivity
        logs,repair inventory,ODB hash,reports/pnr/result_summary.json measured drc.violations/antenna.violations/design.die_area
        and reports/pnr/execution_status.json.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
      - REQ-B3136724E4AB
      - REQ-17C25DACF539
      - REQ-68A4C372A16F
      design_groups:
      - physical.scope
      responsible_stage: pnr
      dependencies:
