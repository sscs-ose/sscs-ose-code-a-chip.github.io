categories:
- key: delivery
  name: Delivery and integration
  cards:
  - key: frozen-delivery
    title: Frozen Delivery
    items:
    - id: AC-DELIVERY
      title: Deliver exact frozen base contract
      detail: 'Responsible stage: full-design-integration. Configuration: project
        delivery. Dependencies: captured ready specification and frozen constraints.
        Procedure: Read the actual root t09-base-contract.md and compare it directly
        to source-contract.md bytes from line19 through EOF; validate the immutable
        companion acceptance.md identity and delivery manifest. Pass condition: File
        exists at the exact regular-file path; byte equality,6930 bytes and SHA2561021e4b88446ed12c7b6a3cc6f46847f16a44c70a47660fff24f5f91ca778958
        all agree. Missing, reformatted or truncated content fails. Evidence: Actual
        delivered byte object, source and companion hashes, manifest with responsible
        owner, direct comparison result bound to SPEC_AUTHORITY.'
      requirement_ids:
      - REQ-AB306F4AA831
      design_groups:
      - spec.authority
      responsible_stage: full-design-integration
      dependencies: []
      source_refs:
      - spec/design_doc.md#baseline-delivery
      execution_status: not_run
    - id: AC-ORIGINAL
      title: Original implementation and immutable checker
      detail: 'Responsible stage: rtl-implementation. Configuration: both core configurations.
        Dependencies: captured ready specification and frozen constraints. Procedure:
        Audit the implementation history and authorized input/dependency inventory;
        compare the independent checker and fixture/config/seed hashes before and
        after all runs. Check original RTL elaborates and synthesizes. Pass condition:
        Fresh original synthesizable RTL; no copied reference/prior-candidate/private
        answer content in the workspace and zero checker/config/seed modifications
        to obtain PASS. Do not inspect excluded source to perform this audit. Evidence:
        Repository/dependency lineage, unchanged checker hashes and elaboration/synthesis
        logs.'
      requirement_ids:
      - REQ-FDDBC67C954F
      - REQ-CC6F59551A30
      - REQ-3E3CE6190291
      - REQ-8E067BBEC910
      design_groups:
      - project.scope
      responsible_stage: rtl-implementation
      dependencies: []
      source_refs:
      - spec/source-contract.md#L3
      - spec/source-contract.md#L15
      execution_status: not_run
    - id: AC-RESOURCES
      title: Measure development resource envelope
      detail: 'Responsible stage: rtl-implementation. Configuration: development attempt.
        Dependencies: captured ready specification and frozen constraints. Procedure:
        Obtain platform allocation, cumulative task wall-time/token accounting, memory
        peak and writable-disk usage for the development attempt; reconcile against
        declared resource limits. Pass condition: Allocation16vCPU, RAM<=32GiB, writable
        disk<=100GiB, development<=2h and same-model tokens<=1200000. Missing accounting
        is unavailable/pending, never fabricated PASS; these are development limits,
        not hardware targets. Evidence: Platform allocation and actual resource/time/token
        receipts linked to the attempt.'
      requirement_ids:
      - REQ-83E61D370EBF
      - REQ-264F9B513D18
      - REQ-2FC06D942B8A
      - REQ-6AC755A84F95
      - REQ-919A9AD6965D
      design_groups:
      - project.resources
      responsible_stage: rtl-implementation
      dependencies: []
      source_refs:
      - spec/source-contract.md#L35
      execution_status: not_run
