    - id: AC-NPU-ARITH
      title: Compare signed four-lane dot arithmetic
      detail: 'Responsible stage: functional-performance-verify. Configuration: standalone
        NPU. Dependencies: AC-NPU-PORTS, AC-RUNTIME. Procedure: Use an independent
        integer oracle on asymmetric lane patterns,each of25Cartesian signed lane-pair
        values from{-128,-1,0,1,127} in each of4lane positions,full extreme vectors
        and random words from a manifest-fixed seed and sample count (record the count
        before execution; no source numerical random-NPU minimum); repeat unrelated
        requests to detect carryover. Inspect four parallel16bit products and widened
        reduction. Pass condition: rsp_data equals signed32 sum of4 signed8 products,lane0
        lowest byte; exact extremes-65024/65536,with sign extension before reduction.
        No saturation,16bit wrap,hidden accumulation or memory effects; every presented
        oracle case matches. Evidence: Operand/result vectors,oracle code/hash,zero
        mismatch count and product/reduction structure.'
