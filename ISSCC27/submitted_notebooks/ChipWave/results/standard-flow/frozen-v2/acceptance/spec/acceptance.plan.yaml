        cell sets/units and actual SDC digest. Inspect elaborated physical boundary.
        Pass condition: Sky130HD tt_025C_1v80,topnebula_cpu_npu_top/coreenabled,no
        pads/package/SRAM/external-memory arrays. All resource hashes/cell views match;
        missing/mismatched view blocks execution. clk100ns waveform0/50,setup/hold
        uncertainty0.1ns,source latency0,slew0.05ns,IOmin/max0.5ns,output0.005pFperbit.
        Apply all frozen ports incl observers; no false/multicycle/case/dont_touch/observer/reset
        exemptions. Protocol wait is not multicycle STA. Preserve async reset and
        nominal1.8V/25C. Evidence: Actual input/resource/tool hash manifest,view/cell/unit
        audit,physical port/hierarchy dump and serialized loaded SDC constraints.
