      source_refs:
      - physical/chip-nebula/implementation.constraints.json#/signoff
      execution_status: not_run
    - id: AC-EXPORT-CONSISTENCY
      title: Check final ODB,STA netlist and SPEF identity
      detail: 'Responsible stage: pnr. Configuration: enabled physical top. Dependencies:
        AC-ROUTE-CLEAN, AC-POSTROUTE-STA. Procedure: From final routed ODB regenerate
        functional STA netlist/SPEF and compare actual instances,cells,pins,nets/connectivity
        and parasitic ownership; rebuild identical STA scenario from exported artifacts.
        Pass condition: ODB/exported netlist/SPEF represent one actual final design,all
        functional nets have correct parasitic binding,zero unexplained instance/net/pin
        mismatch; reloaded timing matches within platform gate tolerance1e-6. Every
        hash points to same final revision; physical-only support cells explicitly
        accounted for. Evidence: reports/pnr/post_route_export_consistency.json with
        actual design/export hashes,comparison details and STA reload result; final
        retrievable exports.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
      - REQ-B3136724E4AB
      - REQ-17C25DACF539
      - REQ-68A4C372A16F
      design_groups:
      - physical.scope
      responsible_stage: pnr
      dependencies:
