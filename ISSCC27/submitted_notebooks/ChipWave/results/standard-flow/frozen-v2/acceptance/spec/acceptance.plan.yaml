      source_refs:
      - physical/chip-nebula/implementation.constraints.json#/signoff/independent_decks
      execution_status: not_run
    - id: AC-POWER-AREA
      title: Report actual per-workload activity,power and area
      detail: 'Responsible stage: pnr. Configuration: enabled post-route top. Dependencies:
        AC-EXPORT-CONSISTENCY, AC-DOT64, AC-GEMM8, AC-CONV3. Procedure: Run DOT64,GEMM8,CONV3
        on actual post-route functional design at100ns; capture eligible activity
        from reset deassertion through committed tohost completion,excluding reset/idle
        warm-up/external memories/pads/package; use only supported characterized models.
        Pass condition: Each workload functional output still passes. Report separately
        cycles,activity window boundaries/duration,annotation coverage,dynamic/leakage/total
        estimates and actual design/model hashes,no weighted aggregate. Missing model/activity
        explicitly unavailable,never measured-silicon power or fabricated number.
        Area mapped/placed/core/die/support-cell accounting includes CPU/NPU/RF and
        excludes external memory/pads/package. No area or power hard budget is inferred.
        Evidence: Actual gate/activity traces and mapping coverage,supported-model
        power reports or explicit unavailability reason,measured area breakdown with
        final design identity.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
