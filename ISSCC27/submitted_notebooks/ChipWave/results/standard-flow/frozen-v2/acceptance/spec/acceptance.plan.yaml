      - AC-POSTROUTE-STA
      source_refs:
      - physical/chip-nebula/implementation.constraints.json#/signoff
      execution_status: not_run
    - id: AC-DRC-LVS
      title: Run independent frozen deck DRC and LVS
      detail: 'Responsible stage: pnr; gds-export. Configuration: enabled physical
        top. Dependencies: AC-EXPORT-CONSISTENCY. Procedure: Run manifest-bound drc/sky130hd.lydrc
        and lvs/sky130hd.lylvs on final exported physical geometry with approved GDS/CDL/cell
        views and actual final functional netlist; resolve PG/physical-only-cell treatment
        per approved decks. Pass condition: Independent deckDRC violations0 and LVSmatches
        actual enabled top,not empty/dummy/fixture design. Deck/view/input hashes
        match frozen resources and final exports. Unsupported independent ERC,EM/IR,multi-corner/foundry/pad/package
        qualification explicitly unavailable,never fabricated PASS. Evidence: Actual
        KLayout deck commands/tool versions,input/deck/CDL/GDS hashes,complete marker
        and LVS comparison databases/reports.'
      requirement_ids:
      - REQ-BE04BC186AC6
      - REQ-C953E329C695
      - REQ-CAEE2894B770
      - REQ-F5F055C323E2
      - REQ-B3136724E4AB
      - REQ-17C25DACF539
      - REQ-68A4C372A16F
      design_groups:
      - physical.scope
      responsible_stage: pnr; gds-export
      dependencies:
