- key: verification
  name: Independent acceptance execution
  cards:
  - key: environment
    title: Environment
    items:
    - id: AC-RUNTIME
      title: Qualify official runtime and exclude local coverage
      detail: 'Responsible stage: functional-performance-verify. Configuration: every
        formal common build/run. Dependencies: AC-INTEGRATION. Procedure: In the same
        launch shell explicitly source /tmp/chipnebula-pinned-tools/env.sh then /opt/rh/gcc-toolset-13/enable;
        check source exits,probe actual effective Verilator after both loads and trace
        the binary used by build/run children. Resolve authorized locks and preserve
        both UDB byte identities/history. Pass condition: Verilator release exactly5.048;
        script loads successful before build/run,same shell-instance identity and
        inherited child environment,actual path/hash/probe/report agree. Missing/mismatched
        lineage INVALID; valid checker FAIL/TIMEOUT retains outcome. Historical5.052
        local deviation/counterexample remains visible; local/historical runs contribute0
        common PASS/coverage even with5.048. ISA manual3496d46d01d783f1cc9b4a2a8b45004a97cbac94,ACT4
        4a42cbd3756259bbc1f92a7d816bc2fd2bd551cb,Sail0.14.1,GCC16.1 match section17.2;
        published metadata45entries joins exactly. ELF-generation and benchmark UDB
        hashes remain distinct,no regeneration to erase comment difference. Same immutable
