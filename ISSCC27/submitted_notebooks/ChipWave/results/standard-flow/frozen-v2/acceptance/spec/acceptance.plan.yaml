      title: Check approved PDN,cell recipes and routing policy
      detail: 'Responsible stage: pnr. Configuration: enabled physical top. Dependencies:
        AC-FLOORPLAN. Procedure: Inspect actual power connectivity,tap/tie/fill/diode
        roster and routed layers/tracks against exact hashed pdn.tcl,tapcell.tcl,config.mk,fastroute.tcl,make_tracks.tcl
        and technologyLEF. Pass condition: VDD1.8/VSS0 connect VPWR/VPB and VGND/VNB
        correctly; approvedmet1followpin0.48um/5.44um,met4stripes1.6/27.14offset13.57,met5stripes1.6/27.2offset13.6
        andmet1-met4/met4-met5connectivity;tapdistance14um and exact approved tie/fill/diode
        cells. Signalsmet1..5,clocksmet3..5,capacityadjustment0.2,legal manifest tracks/vias;
        no added layers/NDR/shielding/keepouts/low-power features. No missing PG connection
        or unapproved support-cell recipe. Evidence: ODB/netlist PG connectivity,PDN/tap/support-cell
        inventory,routing settings and actual route/layer legality checks.'
