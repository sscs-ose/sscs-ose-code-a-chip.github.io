        sum; range endpoints-1040384/1048576 handled. Every result word,commit/store/protocol/final-image
        check passes,tohost completes normally; no M instruction,NPU accumulator,saturation
        or hidden memory operation. Report actual cycles with no invented workload-cycle
        threshold. Evidence: Program/input/output/oracle hashes,independent expected
        values,commit/bus/final-image reports and per-workload cycles.'
