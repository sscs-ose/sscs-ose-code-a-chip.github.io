        Dependencies: AC-DRC-LVS, AC-POWER-AREA, AC-EXPORT-CONSISTENCY. Procedure:
        Export actual routed enabled top with approved library geometry,open GDS in
        KLayout,enumerate top/hierarchy/bounds and join it to final ODB/netlist/SPEF/deck
        results; verify every final file is retrievable. Pass condition: GDSbytes>0,readable=true,correct
        topnebula_cpu_npu_top and populated actual functional geometry/hierarchy;
        no missing referenced cells,ports/memory boundary correct. Independent DRC/LVS
        and final STA/electrical/antenna results correspond to this export. No foundry
        authorization,tapeout,package or fabricated silicon claims. Evidence: Actual
        GDSbytes/hash/readability/top-cell report,final export lineage and build/gds/result_summary.json
        measured gds.bytes/gds.readable/gds.top_cell.'
