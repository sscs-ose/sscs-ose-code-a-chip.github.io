      title: Measure exact n+2 response and held backpressure
      detail: 'Responsible stage: functional-performance-verify. Configuration: standalone
        NPU. Dependencies: AC-NPU-ARITH. Procedure: Record req_valid&&req_ready acceptance
        at edge n,probe post-edge validity through n+2,hold rsp_ready low across varied
        durations,then consume; keep requests asserted while busy and across response
        consumption. Pass condition: First valid exactly after n+2,never early/late;
        data and valid stable until actual response handshake. Outstanding count<=1;
        no acceptance during pending/held response or its consumption edge under signed
        FSM. Earliest new response consumption n+3; next request requires later IDLE
        handshake; no missing/duplicate responses. Evidence: Per-edge handshake/result
        ledger and held-response waveforms.'
