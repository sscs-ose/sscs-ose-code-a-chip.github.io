  - key: fetch-reset
    title: Fetch Reset
    items:
    - id: AC-FETCH
      title: Pair fetch responses and ignore unowned data
      detail: 'Responsible stage: functional-performance-verify. Configuration: both
        core configurations. Dependencies: AC-INTEGRATION, AC-RUNTIME, AC-ENVIRONMENT.
        Procedure: Use the one-cycle registered imem model, toggle invalid-cycle data,
        hold decode during memory/CSR waits, and return already accepted wrong-path
        responses around each redirect. Pass condition: Each accepted rising-edge
        request owns only its next-cycle ordered word; no unrequested data is consumed
        and no token/PC is lost or duplicated. Stalled word is retained; wrong-path
        responses are discarded. With invalid IF/ID, stale CSR/MRET-looking data never
        blocks permitted target fetch at the next edge after redirect; valid serial
        tokens still wait for older stages. Evidence: Pre-edge request/post-edge response
        and event traces including reset epochs and stale-data regression.'
