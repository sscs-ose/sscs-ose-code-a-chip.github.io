  - key: floorplan-routing
    title: Floorplan Routing
    items:
    - id: AC-FLOORPLAN
      title: Validate planned geometry and native legal rows separately
      detail: 'Responsible stage: pnr. Configuration: enabled physical top under calibrated-geometry-v2.
        Dependencies: AC-SYNTHESIS and AC-PHYSICAL-INPUTS, plus a confirmed/frozen
        acceptance revision bound to frozen constraints revision 2. Procedure: Obtain
        actual mapped functional cell area A and its netlist/hash/stage evidence.
        Compute nominal side sqrt(A/0.40), planned width ceil(side/0.46)*0.46 and
        height ceil(side/2.72)*2.72; planned core is [10,10,10+width,10+height] um
        and planned die is [0,0,width+20,height+20] um. Convert through the frozen
        technology''s actual DBU-per-um without inventing an epsilon tolerance. Invoke
        stock native initialize_floorplan with explicit planned core/die, site unithd,
        approved binary and two-thread policy; retain manifest-bound technology LEF
        and make_tracks.tcl. Derive expected native legal bounds independently on
        the calibrated grid anchored at die origin (0,0): lower x/y bounds round inward
        upward to 0.46/2.72 um grids, upper x/y bounds round inward downward to those
        grids. Enumerate actual ODB rows/sites to derive origins, orientations, dimensions,
        per-row site counts, total legal site area and union bbox; cross-check ODB
        getCoreArea against the native legal-row bbox in integer DBU. At placement
        and final physical export, repeat row/site and pin legality checks and bind
        results to the actual database. Pass condition: Actual die equals planned
        die in native integer DBU; planned core follows the unchanged formula. The
        nonempty actual native legal-row region agrees with stock generation/inward
        snapping, is contained in planned core and actual die, and has at least 10
        um margin to all four die sides. Row/site grid, orientations and all placements
        obey the frozen technology/site rules. Planning bbox and legal-row bbox are
        distinct measurements and equality between them is not required. Never substitute
        occupied-instance bbox for either, force off-grid rows, alter stock track
        phases, silently enlarge the die or spoof core/row metadata. Retain nominal
        40% planning target, aspect 1, 10 um margins and placement density 0.55; report
        achieved planned and legal-row utilization/aspect separately with explicit
        mapped-area numerator, actual area denominator and stage, rather than force
        legal-row utilization to 40%. Report actual legal-site whitespace and CTS/repair/support-cell
        accounting within the existing nominal 60% planning reserve, with no hidden
        reserve. Every fixed top pin must have recorded location/layer and pass frozen
        horizontal met3/vertical met2, stock track-phase, spacing and corner-clearance
        checks. No pads/macros/fixed die budget or new area ceiling. Failure of snapping,
        nonempty containment, margins, metadata or pin/site legality is an actual
        failure; no waiver or new numeric geometry tolerance. Evidence: Written geometry
        report with actual A/netlist hash, independently computed planned core/die
        and areas, actual DBU units/die/getCoreArea/legal-row bbox, complete row origins/orientations/site
        names/dimensions/counts, total legal site area, separate placed-instance area/occupied
        bbox, planned/legal utilization and aspect, four measured margins, per-bit
        pin/layer/track/spacing legality, support-cell/whitespace accounting and exact
        database/tool/revision hashes. Historical coordinates and empty-fixture calibration
        are examples only, not fixed geometry targets or design acceptance. Preserve
        the original V1 strict-core failure and both failed force-geometry trials;
        this is prospective V2 acceptance.'
