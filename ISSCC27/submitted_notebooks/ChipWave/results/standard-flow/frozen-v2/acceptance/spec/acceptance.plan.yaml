execution_policy:
  configurations:
  - rv32i_five_stage_cpu ENABLE_XNEBULA=0 (default)
  - rv32i_five_stage_cpu ENABLE_XNEBULA=1
  - nebula_cpu_npu_top with core ENABLE_XNEBULA=1
  base_suite: Run every applicable base CPU functional/cycle/protocol test in both
    core configurations, and run integration smoke/workloads on the enabled physical
    top. Standalone NPU checks exercise its specified internal interface.
  evidence: Each item result must carry check ID, stable requirement IDs/design groups,
    baseline/constraint/RTL hashes, actual command/tool identities, run/configuration/ELF/seed/reset/bus
    schedule, raw logs and retrievable evidence hashes. Bind external contract operands
    and results to actual same-run objects; free hashes or constant PASS flags do
    not satisfy acceptance.
  results: Keep NOT_RUN/PENDING, PASS, FAIL, TIMEOUT and INVALID distinct. A qualified
    runtime retains the immutable checker FAIL/TIMEOUT; invalid or missing lineage
    is INVALID. Every required run remains in fixed totals. A timeout is non-passing,
    not a diagnosis.
  completion: Whole-project PASS requires passing evidence for every required item
    and every configuration, complete 443-ID trace coverage, valid common execution,
    no pending/missing result or required adapter, plus required physical/GDS closure.
    Report-only metrics require honest measured values or explicit supported-model
    unavailability; they have no numerical budget.
  scope: Reference calibration and historical results never count as DUT execution.
    ACT4 subset success is not certification. Single-corner engineering closure does
    not imply foundry release or silicon results.
  downstream_permissions: Stage ownership denotes evidence responsibility, not a write/tool
    authorization. Delivery and evaluator owners must execute in their own granted
    scopes; this draft adds no workflow task or permission.
  physical_revision: Every affected physical-stage result must identify this confirmed/frozen
    acceptance revision and constraints revision 2 by actual immutable artifact/file
    hashes, the same signed specification and qualified implementation. Source the
    prescribed environments, explicitly invoke the selected OpenROAD path and verify
    actual resolved bytes/version after environment loads; record NUM_CORES=2 and
    actual tool threads=2. Ambient PATH selection, a version probe detached from the
    execution binary, or old 26Q3/16-core measurements do not qualify.
  physical_revalidation: Rerun or revalidate affected floorplan, rows/pins, placement,
    CTS/repair, routing/extraction, setup/hold/electrical, router/independent DRC,
    LVS, antenna and final exports with actual selected binary, two threads and new
    formal inputs. Require fresh evidence for the external reset waveform and retain
    all recovery/removal/library pulse checks. A previously saved checkpoint may be
    considered only after explicit input, stage and design compatibility checks; unchanged
    filenames or numeric results do not establish qualification.
  functional_evidence_reuse: The geometry/tool revision permits qualified functional
    evidence reuse only after exact source, signed specification, qualified RTL, immutable
    checker/corpus, configuration and original runtime/evidence binding are verified.
    Archive the reuse decision and original run identities; mark results reused rather
    than newly executed. Incompatible or unresolved evidence requires rerun. This
    plan-authoring task does not certify the supplied verification report or execute
    a functional/physical run.
