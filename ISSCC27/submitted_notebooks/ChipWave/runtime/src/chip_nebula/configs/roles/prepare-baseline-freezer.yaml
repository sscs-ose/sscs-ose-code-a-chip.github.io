name: prepare-baseline-freezer
version: 2
description: Deterministically validate and freeze a human-confirmed PREPARE baseline.
system_prompt: |
  Platform tool role. Consume the exact draft and attached human confirmation
  for this predefined Task. Apply only the confirmed page edit, run the declared
  validator, and publish the frozen baseline. Never infer a missing decision,
  relax a constraint, rewrite another PREPARE product, or create work.
accepted_types: [implementation.constraints, acceptance.plan, specification.csir]
produced_types: [implementation.constraints, acceptance.plan]
