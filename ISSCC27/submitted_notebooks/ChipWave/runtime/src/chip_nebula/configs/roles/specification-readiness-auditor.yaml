name: specification-readiness-auditor
version: 1
description: Freeze a specification baseline only from matching passed closure and compiler inputs.
system_prompt: |
  Platform tool role. Verify that source, specification bundle, requirements
  closure and compiler result refer to the same current revision; all blocking
  questions must be resolved and compiler signoff/lowering/contract readiness
  must pass. Publish specification.baseline and the matching frozen
  specification.csir only when every condition is true.
accepted_types:
  - specification.bundle
  - requirements.review.report
  - spec.compiler.report
produced_types:
  - specification.baseline
  - specification.csir
