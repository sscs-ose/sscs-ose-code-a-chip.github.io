[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipwave-case-runtime"
version = "0.1.0+993905b"
description = "Used ChipWave CLI and TaskGraph components for the CPU/NPU notebook case"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML==6.0.3", "psutil==7.2.2", "fastapi==0.142.2", "uvicorn==0.54.0", "ansi2html==1.9.5", "z3-solver==5.1.0.0"]

[project.scripts]
chipwave = "chip_nebula.cli.commands:main"
chip-nebula = "chip_nebula.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chip_nebula = ["configs/**/*"]
