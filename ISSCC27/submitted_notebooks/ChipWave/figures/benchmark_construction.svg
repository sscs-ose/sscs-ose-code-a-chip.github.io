<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Construct a benchmark that can actually be evaluated</title><desc id="desc">Three parameterized families are checked with reference implementations and independent mutant-tested scoreboards before an evaluated agent is run.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1440" height="820" rx="16" fill="#101827"/><rect width="1440" height="820" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">Construct a benchmark that can actually be evaluated</text><text x="28" y="78" font-size="17" fill="#cbd5e1" font-weight="400">Three families, two variants each: counters · synchronous FIFOs · signed INT8 dot products</text><rect x="28" y="120" width="328" height="145" rx="10" fill="#18283f" stroke="#94a3b8" stroke-width="1.5"/><circle cx="43" cy="142" r="4" fill="#94a3b8"/><text x="55" y="148" font-size="16" fill="#f8fafc" font-weight="700">Task parameters</text><text x="42" y="177" font-size="15" fill="#cbd5e1" font-weight="400">Dimensions + behavior</text><text x="42" y="199" font-size="15" fill="#cbd5e1" font-weight="400">Pinned top-level interface</text><path d="M356 192 L380 192" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="120" width="328" height="145" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="395" cy="142" r="4" fill="#2dd4bf"/><text x="407" y="148" font-size="16" fill="#f8fafc" font-weight="700">Construct the task</text><text x="394" y="177" font-size="15" fill="#cbd5e1" font-weight="400">Task card + typed CSIR</text><text x="394" y="199" font-size="15" fill="#cbd5e1" font-weight="400">Public development checker</text><path d="M708 192 L732 192" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="120" width="328" height="145" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="747" cy="142" r="4" fill="#c4b5fd"/><text x="759" y="148" font-size="16" fill="#f8fafc" font-weight="700">Qualify the reference</text><text x="746" y="177" font-size="15" fill="#cbd5e1" font-weight="400">Functional + synthesis checks</text><text x="746" y="199" font-size="15" fill="#cbd5e1" font-weight="400">Reject ≥3 faulty mutants</text><path d="M1060 192 L1084 192" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1084" y="120" width="328" height="145" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1099" cy="142" r="4" fill="#c4b5fd"/><text x="1111" y="148" font-size="16" fill="#f8fafc" font-weight="700">Calibrate the task</text><text x="1098" y="177" font-size="15" fill="#cbd5e1" font-weight="400">Reference GDS + netlist checks</text><text x="1098" y="199" font-size="15" fill="#cbd5e1" font-weight="400">Area cap = 1.25 × cell area</text><rect x="28" y="350" width="660" height="186" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="43" cy="372" r="4" fill="#38bdf8"/><text x="55" y="378" font-size="16" fill="#f8fafc" font-weight="700">Evaluated agent workspace</text><text x="42" y="407" font-size="15" fill="#cbd5e1" font-weight="400">Requirements, interface and development tests</text><text x="42" y="429" font-size="15" fill="#cbd5e1" font-weight="400">Configured designer / verifier / tool dependencies</text><text x="42" y="451" font-size="15" fill="#cbd5e1" font-weight="400">Generated RTL and captured decisions only</text><rect x="38" y="503" width="640" height="24" rx="5" fill="#312454"/><text x="46" y="520" font-size="13" fill="#ddd6fe" font-weight="400">No reference RTL, held-out vectors or other trials</text><rect x="752" y="350" width="660" height="186" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="767" cy="372" r="4" fill="#c4b5fd"/><text x="779" y="378" font-size="16" fill="#f8fafc" font-weight="700">Separate evaluator workspace</text><text x="766" y="407" font-size="15" fill="#cbd5e1" font-weight="400">Frozen final scoreboard and numerical oracle</text><text x="766" y="429" font-size="15" fill="#cbd5e1" font-weight="400">Candidate-bound physical and workload checks</text><text x="766" y="451" font-size="15" fill="#cbd5e1" font-weight="400">Record task validity separately from agent success</text><rect x="762" y="503" width="640" height="24" rx="5" fill="#312454"/><text x="770" y="520" font-size="13" fill="#ddd6fe" font-weight="400">Public materials; isolated during each scored run</text><path d="M688 440 L752 440" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><path d="M1250 265 L1250 315 L350 315 L350 350" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="340" font-size="14" fill="#7dd3fc" font-weight="400">Frozen task + allowed tools</text><rect x="28" y="620" width="1384" height="112" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="43" cy="642" r="4" fill="#2dd4bf"/><text x="55" y="648" font-size="16" fill="#f8fafc" font-weight="700">What a reader can reproduce</text><text x="42" y="677" font-size="15" fill="#cbd5e1" font-weight="400">Build a new variant → qualify its checks and constraints → choose a workflow → inspect all results and costs</text><rect x="38" y="699" width="1364" height="24" rx="5" fill="#312454"/><text x="46" y="716" font-size="13" fill="#ddd6fe" font-weight="400">Template-based construction; arbitrary natural-language generation is outside the validated scope</text><text x="28" y="784" font-size="15" fill="#cbd5e1" font-weight="400">An invalid task is a construction failure. A correct task with a failing design is an agent result. Keep both.</text></g></svg>