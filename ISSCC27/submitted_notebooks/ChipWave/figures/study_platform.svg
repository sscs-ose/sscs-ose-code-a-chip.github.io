<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">ChipWave · configure, freeze, execute, compare</title><desc id="desc">Built-in specification-to-GDS roles and workflow, custom fixed-contract experiments, immutable deliveries and independent engineering gates.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1440" height="820" rx="16" fill="#101827"/><rect width="1440" height="820" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">ChipWave · configure, freeze, execute, compare</text><text x="28" y="76" font-size="17" fill="#cbd5e1" font-weight="400">Built-in templates + project-local roles, recipes, tools, skills and IP</text><rect x="28" y="105" width="1384" height="100" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="43" cy="127" r="4" fill="#c4b5fd"/><text x="55" y="133" font-size="16" fill="#f8fafc" font-weight="700">Freeze the experiment</text><text x="42" y="162" font-size="13" fill="#cbd5e1" font-weight="400">Inputs · role prompts/model · permissions · dependencies · tool versions · IP · budgets · acceptance · selection rule</text><rect x="38" y="172" width="1364" height="24" rx="5" fill="#312454"/><text x="46" y="189" font-size="12" fill="#ddd6fe" font-weight="400">Change a configuration → create a new frozen experiment; retain the previous run</text><rect x="28" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#94a3b8" stroke-width="1.5"/><circle cx="43" cy="282" r="4" fill="#94a3b8"/><text x="55" y="288" font-size="16" fill="#f8fafc" font-weight="700">Design entry</text><text x="42" y="317" font-size="13" fill="#cbd5e1" font-weight="400">Requirements or design</text><text x="42" y="339" font-size="13" fill="#cbd5e1" font-weight="400">Optional existing IP</text><rect x="38" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="46" y="404" font-size="12" fill="#ddd6fe" font-weight="400">immutable source</text><path d="M242 337 L262 337" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="262" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="277" cy="282" r="4" fill="#38bdf8"/><text x="289" y="288" font-size="16" fill="#f8fafc" font-weight="700">Specification</text><text x="276" y="317" font-size="13" fill="#cbd5e1" font-weight="400">Author + closure reviewer</text><text x="276" y="339" font-size="13" fill="#cbd5e1" font-weight="400">CSIR compiler / constraints</text><rect x="272" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="280" y="404" font-size="12" fill="#ddd6fe" font-weight="400">specification + acceptance</text><path d="M476 337 L496 337" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="496" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="511" cy="282" r="4" fill="#38bdf8"/><text x="523" y="288" font-size="16" fill="#f8fafc" font-weight="700">RTL / integration</text><text x="510" y="317" font-size="13" fill="#cbd5e1" font-weight="400">RTL designer + integrator</text><text x="510" y="339" font-size="13" fill="#cbd5e1" font-weight="400">Implement or adapt IP</text><rect x="506" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="514" y="404" font-size="12" fill="#ddd6fe" font-weight="400">versioned source delivery</text><path d="M710 337 L730 337" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="745" cy="282" r="4" fill="#c4b5fd"/><text x="757" y="288" font-size="16" fill="#f8fafc" font-weight="700">Verification</text><text x="744" y="317" font-size="13" fill="#cbd5e1" font-weight="400">Independent verifier</text><text x="744" y="339" font-size="13" fill="#cbd5e1" font-weight="400">Functional / protocol checks</text><rect x="740" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="748" y="404" font-size="12" fill="#ddd6fe" font-weight="400">release only on pass</text><path d="M944 337 L964 337" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="964" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="979" cy="282" r="4" fill="#2dd4bf"/><text x="991" y="288" font-size="16" fill="#f8fafc" font-weight="700">Physical design</text><text x="978" y="317" font-size="13" fill="#cbd5e1" font-weight="400">Synthesis / P&amp;R roles</text><text x="978" y="339" font-size="13" fill="#cbd5e1" font-weight="400">Open-source EDA tools</text><rect x="974" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="982" y="404" font-size="12" fill="#ddd6fe" font-weight="400">STA · electrical · DRC · LVS</text><path d="M1178 337 L1198 337" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1198" y="260" width="214" height="160" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="1213" cy="282" r="4" fill="#2dd4bf"/><text x="1225" y="288" font-size="16" fill="#f8fafc" font-weight="700">GDS / evidence</text><text x="1212" y="317" font-size="13" fill="#cbd5e1" font-weight="400">GDS exporter</text><text x="1212" y="339" font-size="13" fill="#cbd5e1" font-weight="400">Layout + reports</text><rect x="1208" y="387" width="194" height="24" rx="5" fill="#312454"/><text x="1216" y="404" font-size="12" fill="#ddd6fe" font-weight="400">qualified result or failure</text><text x="28" y="238" font-size="15" fill="#7dd3fc" font-weight="700">STANDARD PATH · grouped view of the 20-task specification-to-GDS recipe</text><path d="M1030 420 L1030 465 L590 465 L590 420" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="380" y="490" font-size="15" fill="#fcd34d" font-weight="400">Evidence returns to the existing responsible task; engineering gates run again</text><rect x="28" y="530" width="438" height="164" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="43" cy="552" r="4" fill="#38bdf8"/><text x="55" y="558" font-size="16" fill="#f8fafc" font-weight="700">Experiment A · roles and IP</text><text x="42" y="587" font-size="13" fill="#cbd5e1" font-weight="400">Same dot4 contract: fresh RTL or raw IP</text><text x="42" y="609" font-size="13" fill="#cbd5e1" font-weight="400">Single role or designer + reviewer</text><text x="42" y="631" font-size="13" fill="#cbd5e1" font-weight="400">12 real trials; independent final checker</text><rect x="38" y="661" width="418" height="24" rx="5" fill="#312454"/><text x="46" y="678" font-size="12" fill="#ddd6fe" font-weight="400">Focused contract; no repeated CSIR authoring</text><rect x="496" y="530" width="438" height="164" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="511" cy="552" r="4" fill="#38bdf8"/><text x="523" y="558" font-size="16" fill="#f8fafc" font-weight="700">Experiment B · PPA workflows</text><text x="510" y="587" font-size="13" fill="#cbd5e1" font-weight="400">Same verified CPU + NPU and 95 MHz target</text><text x="510" y="609" font-size="13" fill="#cbd5e1" font-weight="400">Rules / one optimizer / optimizer + reviewer</text><text x="510" y="631" font-size="13" fill="#cbd5e1" font-weight="400">Three new physical candidates per search</text><rect x="506" y="661" width="418" height="24" rx="5" fill="#312454"/><text x="514" y="678" font-size="12" fill="#ddd6fe" font-weight="400">EDA executes independently of AI decisions</text><rect x="964" y="530" width="448" height="164" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="979" cy="552" r="4" fill="#c4b5fd"/><text x="991" y="558" font-size="16" fill="#f8fafc" font-weight="700">Compare with retained evidence</text><text x="978" y="587" font-size="13" fill="#cbd5e1" font-weight="400">Success + failures + unused budget slots</text><text x="978" y="609" font-size="13" fill="#cbd5e1" font-weight="400">Time · Tokens · repairs · area · energy</text><text x="978" y="631" font-size="13" fill="#cbd5e1" font-weight="400">Source-bound workload and parasitic checks</text><rect x="974" y="661" width="428" height="24" rx="5" fill="#312454"/><text x="982" y="678" font-size="12" fill="#ddd6fe" font-weight="400">Search finished ≠ chip qualified</text><text x="28" y="742" font-size="15" fill="#cbd5e1" font-weight="400">Built-in engineering path and custom research workflows share Role, TaskGraph, Artifact and feedback mechanisms.</text><text x="28" y="779" font-size="14" fill="#94a3b8" font-weight="400">Measured: within-run feedback. Cross-design RSI / skill self-improvement is not evaluated here.</text></g></svg>