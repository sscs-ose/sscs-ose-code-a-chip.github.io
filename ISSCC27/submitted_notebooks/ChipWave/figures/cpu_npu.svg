<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">CPU NPU case-study architecture</title><desc id="desc">Five CPU stages invoke a four-lane signed INT8 NPU with a request/response and kill interface. Instruction and data memories are outside the physical core.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#35618f"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#223047"><text x="40" y="43" font-size="28" font-weight="bold">CPU with an instruction-coupled INT8 NPU</text><rect x="40" y="90" width="1010" height="370" rx="12" fill="#f8fbff" stroke="#8faaca" stroke-width="2"/><text x="60" y="119" font-size="19" font-weight="bold">Physical core: nebula_cpu_npu_top</text><rect x="70" y="145" width="155" height="78" rx="10" fill="#edf4fc" stroke="#8faaca" stroke-width="2"/><text x="147.5" y="176" text-anchor="middle" font-size="21" font-weight="bold">IF</text><text x="147.5" y="202" text-anchor="middle" font-size="16">Fetch</text><path d="M226 183 L254 183" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="255" y="145" width="155" height="78" rx="10" fill="#edf4fc" stroke="#8faaca" stroke-width="2"/><text x="332.5" y="176" text-anchor="middle" font-size="21" font-weight="bold">ID</text><text x="332.5" y="202" text-anchor="middle" font-size="16">Decode + registers</text><path d="M411 183 L439 183" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="145" width="155" height="78" rx="10" fill="#edf4fc" stroke="#8faaca" stroke-width="2"/><text x="517.5" y="176" text-anchor="middle" font-size="21" font-weight="bold">EX</text><text x="517.5" y="202" text-anchor="middle" font-size="16">Issue xdot4</text><path d="M596 183 L624 183" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="625" y="145" width="155" height="78" rx="10" fill="#edf4fc" stroke="#8faaca" stroke-width="2"/><text x="702.5" y="176" text-anchor="middle" font-size="21" font-weight="bold">MEM</text><text x="702.5" y="202" text-anchor="middle" font-size="16">Memory interface</text><path d="M781 183 L809 183" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="810" y="145" width="155" height="78" rx="10" fill="#edf4fc" stroke="#8faaca" stroke-width="2"/><text x="887.5" y="176" text-anchor="middle" font-size="21" font-weight="bold">WB</text><text x="887.5" y="202" text-anchor="middle" font-size="16">Retire</text><rect x="395" y="303" width="470" height="98" rx="10" fill="#eff7ef" stroke="#8faaca" stroke-width="2"/><text x="630" y="334" text-anchor="middle" font-size="21" font-weight="bold">nebula_npu_dot4</text><text x="630" y="360" text-anchor="middle" font-size="16">4 signed INT8 products → widened INT32 sum</text><path d="M470 226 L470 300" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 301 L700 268 L560 268 L560 226" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="235" y="265" font-size="17">request / operands / kill</text><text x="715" y="282" font-size="17">response / result</text><rect x="1090" y="145" width="300" height="78" rx="10" fill="#fff4e8" stroke="#8faaca" stroke-width="2"/><text x="1240" y="176" text-anchor="middle" font-size="21" font-weight="bold">Instruction memory</text><text x="1240" y="202" text-anchor="middle" font-size="16">External to core</text><rect x="1090" y="303" width="300" height="78" rx="10" fill="#fff4e8" stroke="#8faaca" stroke-width="2"/><text x="1240" y="334" text-anchor="middle" font-size="21" font-weight="bold">Data memory</text><text x="1240" y="360" text-anchor="middle" font-size="16">External to core</text><path d="M1051 183 L1087 183" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1051 342 L1087 342" fill="none" stroke="#35618f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="60" y="438" font-size="17">Base CPU contract + separately versioned Xnebula extension; one NPU operation in flight</text><text x="40" y="518" font-size="18">Workloads: DOT64 · GEMM8 · CONV3     Software: .insn r 0x0b, 0, 0, rd, rs1, rs2</text></g></svg>
