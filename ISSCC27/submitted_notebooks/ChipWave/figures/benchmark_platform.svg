<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">ChipWave · build tasks, configure workflows, compare evidence</title><desc id="desc">A configurable platform connects benchmark construction, built-in and custom roles, fixed experimental contracts and independent chip evaluation.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1440" height="840" rx="16" fill="#101827"/><rect width="1440" height="840" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">ChipWave · build tasks, configure workflows, compare evidence</text><text x="28" y="78" font-size="17" fill="#cbd5e1" font-weight="400">A research instrument: change the task or workflow; keep the comparison conditions explicit.</text><rect x="28" y="112" width="440" height="174" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="43" cy="134" r="4" fill="#2dd4bf"/><text x="55" y="140" font-size="16" fill="#f8fafc" font-weight="700">Build the benchmark</text><text x="42" y="169" font-size="15" fill="#cbd5e1" font-weight="400">Choose a family, parameters and interface</text><text x="42" y="191" font-size="15" fill="#cbd5e1" font-weight="400">CSIR + behavioral acceptance contract</text><text x="42" y="213" font-size="15" fill="#cbd5e1" font-weight="400">Reference + mutants + 10 MHz calibration</text><rect x="38" y="253" width="420" height="24" rx="5" fill="#312454"/><text x="46" y="270" font-size="13" fill="#ddd6fe" font-weight="400">Task validity is checked before agent scoring</text><rect x="500" y="112" width="440" height="174" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="515" cy="134" r="4" fill="#38bdf8"/><text x="527" y="140" font-size="16" fill="#f8fafc" font-weight="700">Configure the experiment</text><text x="514" y="169" font-size="15" fill="#cbd5e1" font-weight="400">15 built-in roles / 20-task standard recipe</text><text x="514" y="191" font-size="15" fill="#cbd5e1" font-weight="400">Customize roles, dependencies, tools and IP</text><text x="514" y="213" font-size="15" fill="#cbd5e1" font-weight="400">Freeze model, actions, budget and gates</text><rect x="510" y="253" width="420" height="24" rx="5" fill="#312454"/><text x="518" y="270" font-size="13" fill="#ddd6fe" font-weight="400">Project-local YAML, same TaskGraph kernel</text><rect x="972" y="112" width="440" height="174" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="987" cy="134" r="4" fill="#c4b5fd"/><text x="999" y="140" font-size="16" fill="#f8fafc" font-weight="700">Keep the evaluator independent</text><text x="986" y="169" font-size="15" fill="#cbd5e1" font-weight="400">Agent sees requirements + development tests</text><text x="986" y="191" font-size="15" fill="#cbd5e1" font-weight="400">Reference and held-out grader stay separate</text><text x="986" y="213" font-size="15" fill="#cbd5e1" font-weight="400">Function + STA + electrical + DRC + LVS</text><rect x="982" y="253" width="420" height="24" rx="5" fill="#312454"/><text x="990" y="270" font-size="13" fill="#ddd6fe" font-weight="400">Saved success, failure, cost and provenance</text><path d="M468 198 L500 198" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 198 L972 198" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="336" font-size="16" fill="#7dd3fc" font-weight="700">FLAGSHIP EXAMPLE · one CPU + accelerator; workflow organization is the experimental variable</text><rect x="28" y="370" width="328" height="146" rx="10" fill="#18283f" stroke="#94a3b8" stroke-width="1.5"/><circle cx="43" cy="392" r="4" fill="#94a3b8"/><text x="55" y="398" font-size="16" fill="#f8fafc" font-weight="700">Frozen task</text><text x="42" y="427" font-size="15" fill="#cbd5e1" font-weight="400">Five-stage RV32I + dot4</text><text x="42" y="449" font-size="15" fill="#cbd5e1" font-weight="400">Same starting chip and workloads</text><path d="M356 442 L380 442" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="370" width="328" height="146" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="395" cy="392" r="4" fill="#38bdf8"/><text x="407" y="398" font-size="16" fill="#f8fafc" font-weight="700">Configured roles</text><text x="394" y="427" font-size="15" fill="#cbd5e1" font-weight="400">Optimizer and optional reviewer</text><text x="394" y="449" font-size="15" fill="#cbd5e1" font-weight="400">F0 / F1 / F2 relationships</text><path d="M708 442 L732 442" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="370" width="328" height="146" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="747" cy="392" r="4" fill="#2dd4bf"/><text x="759" y="398" font-size="16" fill="#f8fafc" font-weight="700">Protected tools</text><text x="746" y="427" font-size="15" fill="#cbd5e1" font-weight="400">Shared RTL actions + parameters</text><text x="746" y="449" font-size="15" fill="#cbd5e1" font-weight="400">Synthesis → route → extraction</text><path d="M1060 442 L1084 442" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1084" y="370" width="328" height="146" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1099" cy="392" r="4" fill="#c4b5fd"/><text x="1111" y="398" font-size="16" fill="#f8fafc" font-weight="700">Independent measurement</text><text x="1098" y="427" font-size="15" fill="#cbd5e1" font-weight="400">Qualified area and energy</text><text x="1098" y="449" font-size="15" fill="#cbd5e1" font-weight="400">Retain the best valid candidate</text><path d="M1250 516 L1250 570 L545 570 L545 516" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="450" y="599" font-size="15" fill="#fcd34d" font-weight="400">Measured feedback → next proposal within the same frozen workflow and budget</text><rect x="28" y="650" width="676" height="122" rx="10" fill="#18283f" stroke="#94a3b8" stroke-width="1.5"/><circle cx="43" cy="672" r="4" fill="#94a3b8"/><text x="55" y="678" font-size="16" fill="#f8fafc" font-weight="700">Application value</text><text x="42" y="707" font-size="15" fill="#cbd5e1" font-weight="400">CPU + INT8 accelerator runs useful arithmetic workloads</text><text x="42" y="729" font-size="15" fill="#cbd5e1" font-weight="400">Application speedup is a property of the worked chip.</text><rect x="736" y="650" width="676" height="122" rx="10" fill="#18283f" stroke="#94a3b8" stroke-width="1.5"/><circle cx="751" cy="672" r="4" fill="#94a3b8"/><text x="763" y="678" font-size="16" fill="#f8fafc" font-weight="700">Research value</text><text x="750" y="707" font-size="15" fill="#cbd5e1" font-weight="400">The platform exposes role/workflow tradeoffs and their costs</text><text x="750" y="729" font-size="15" fill="#cbd5e1" font-weight="400">No universal multi-role or cross-task learning claim.</text><text x="28" y="816" font-size="14" fill="#cbd5e1" font-weight="400">Built-in standard path and focused custom experiments share roles, artifacts, dependencies, gates and failure feedback.</text></g></svg>