<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc"><title id="title">PPA exploration · workflow organization as an experimental variable</title><desc id="desc">F0 is a single optimizer, F1 adds fixed independent review, and F2 uses the same roles with first/after-failure conditional review. All have identical actions, budgets and engineering gates.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1600" height="970" rx="16" fill="#101827"/><rect width="1600" height="970" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">PPA exploration · workflow organization as an experimental variable</text><text x="28" y="78" font-size="17" fill="#cbd5e1" font-weight="400">Shared starting CPU + NPU · shared proved RTL actions and implementation parameters · common 95 MHz target</text><text x="28" y="163" font-size="28" fill="#e0f2fe" font-weight="700">F0</text><text x="28" y="193" font-size="15" fill="#cbd5e1" font-weight="400">3 sessions</text><rect x="150" y="135" width="255" height="130" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="165" cy="157" r="4" fill="#38bdf8"/><text x="177" y="163" font-size="16" fill="#f8fafc" font-weight="700">PPA optimizer</text><text x="164" y="192" font-size="15" fill="#cbd5e1" font-weight="400">Read captured real reports</text><text x="164" y="214" font-size="15" fill="#cbd5e1" font-weight="400">Propose one unseen candidate</text><path d="M405 200 L950 200" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="177" font-size="15" fill="#94a3b8" font-weight="400">One role; no AI review</text><rect x="950" y="135" width="270" height="130" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="965" cy="157" r="4" fill="#2dd4bf"/><text x="977" y="163" font-size="16" fill="#f8fafc" font-weight="700">Protected EDA tools</text><text x="964" y="192" font-size="15" fill="#cbd5e1" font-weight="400">Apply common RTL action flags</text><text x="964" y="214" font-size="15" fill="#cbd5e1" font-weight="400">Synthesis / P&amp;R / extraction</text><path d="M1220 200 L1250 200" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="135" width="320" height="130" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1265" cy="157" r="4" fill="#c4b5fd"/><text x="1277" y="163" font-size="16" fill="#f8fafc" font-weight="700">Independent engineering gates</text><text x="1264" y="192" font-size="15" fill="#cbd5e1" font-weight="400">Function / equivalence / workloads</text><text x="1264" y="214" font-size="15" fill="#cbd5e1" font-weight="400">STA / electrical / DRC / LVS</text><path d="M1410 265 L1410 322 L275 322 L275 265" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="655" y="348" font-size="15" fill="#fcd34d" font-weight="400">Report + best valid result → next proposal; stop at the shared budget</text><text x="28" y="408" font-size="28" fill="#e0f2fe" font-weight="700">F1</text><text x="28" y="438" font-size="15" fill="#cbd5e1" font-weight="400">3 sessions</text><rect x="150" y="380" width="255" height="130" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="165" cy="402" r="4" fill="#38bdf8"/><text x="177" y="408" font-size="16" fill="#f8fafc" font-weight="700">PPA optimizer</text><text x="164" y="437" font-size="15" fill="#cbd5e1" font-weight="400">Read captured real reports</text><text x="164" y="459" font-size="15" fill="#cbd5e1" font-weight="400">Propose one unseen candidate</text><path d="M405 445 L670 445" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="422" font-size="14" fill="#cbd5e1" font-weight="400">Every proposal</text><rect x="670" y="380" width="245" height="130" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="685" cy="402" r="4" fill="#38bdf8"/><text x="697" y="408" font-size="16" fill="#f8fafc" font-weight="700">Independent reviewer</text><text x="684" y="437" font-size="15" fill="#cbd5e1" font-weight="400">Same reviewer as F2</text><text x="684" y="459" font-size="15" fill="#cbd5e1" font-weight="400">Findings return to optimizer</text><path d="M915 445 L950 445" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 510 L792 534 L275 534 L275 510" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><rect x="950" y="380" width="270" height="130" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="965" cy="402" r="4" fill="#2dd4bf"/><text x="977" y="408" font-size="16" fill="#f8fafc" font-weight="700">Protected EDA tools</text><text x="964" y="437" font-size="15" fill="#cbd5e1" font-weight="400">Apply common RTL action flags</text><text x="964" y="459" font-size="15" fill="#cbd5e1" font-weight="400">Synthesis / P&amp;R / extraction</text><path d="M1220 445 L1250 445" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="380" width="320" height="130" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1265" cy="402" r="4" fill="#c4b5fd"/><text x="1277" y="408" font-size="16" fill="#f8fafc" font-weight="700">Independent engineering gates</text><text x="1264" y="437" font-size="15" fill="#cbd5e1" font-weight="400">Function / equivalence / workloads</text><text x="1264" y="459" font-size="15" fill="#cbd5e1" font-weight="400">STA / electrical / DRC / LVS</text><path d="M1410 510 L1410 567 L275 567 L275 510" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="655" y="593" font-size="15" fill="#fcd34d" font-weight="400">Report + best valid result → next proposal; stop at the shared budget</text><text x="28" y="653" font-size="28" fill="#e0f2fe" font-weight="700">F2</text><text x="28" y="683" font-size="15" fill="#cbd5e1" font-weight="400">3 sessions</text><rect x="150" y="625" width="255" height="130" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="165" cy="647" r="4" fill="#38bdf8"/><text x="177" y="653" font-size="16" fill="#f8fafc" font-weight="700">PPA optimizer</text><text x="164" y="682" font-size="15" fill="#cbd5e1" font-weight="400">Read captured real reports</text><text x="164" y="704" font-size="15" fill="#cbd5e1" font-weight="400">Propose one unseen candidate</text><path d="M405 690 L435 690" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="435" y="625" width="205" height="130" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="450" cy="647" r="4" fill="#c4b5fd"/><text x="462" y="653" font-size="16" fill="#f8fafc" font-weight="700">Review condition</text><text x="449" y="682" font-size="15" fill="#cbd5e1" font-weight="400">First candidate OR</text><text x="449" y="704" font-size="15" fill="#cbd5e1" font-weight="400">prior candidate failed</text><path d="M640 690 L670 690" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="625" width="245" height="130" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="685" cy="647" r="4" fill="#38bdf8"/><text x="697" y="653" font-size="16" fill="#f8fafc" font-weight="700">Independent reviewer</text><text x="684" y="682" font-size="15" fill="#cbd5e1" font-weight="400">Same role/prompt as F1</text><text x="684" y="704" font-size="15" fill="#cbd5e1" font-weight="400">Triggered only when needed</text><path d="M915 690 L950 690" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><path d="M538 625 L538 600 L1070 600 L1070 625" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="618" font-size="15" fill="#7dd3fc" font-weight="400">Bypass path: 0 uses in measured sessions</text><path d="M792 755 L792 779 L275 779 L275 755" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><rect x="950" y="625" width="270" height="130" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="965" cy="647" r="4" fill="#2dd4bf"/><text x="977" y="653" font-size="16" fill="#f8fafc" font-weight="700">Protected EDA tools</text><text x="964" y="682" font-size="15" fill="#cbd5e1" font-weight="400">Apply common RTL action flags</text><text x="964" y="704" font-size="15" fill="#cbd5e1" font-weight="400">Synthesis / P&amp;R / extraction</text><path d="M1220 690 L1250 690" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="625" width="320" height="130" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1265" cy="647" r="4" fill="#c4b5fd"/><text x="1277" y="653" font-size="16" fill="#f8fafc" font-weight="700">Independent engineering gates</text><text x="1264" y="682" font-size="15" fill="#cbd5e1" font-weight="400">Function / equivalence / workloads</text><text x="1264" y="704" font-size="15" fill="#cbd5e1" font-weight="400">STA / electrical / DRC / LVS</text><path d="M1410 755 L1410 812 L275 812 L275 755" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="655" y="838" font-size="15" fill="#fcd34d" font-weight="400">Report + best valid result → next proposal; stop at the shared budget</text><text x="28" y="915" font-size="16" fill="#cbd5e1" font-weight="400">Per session: all roles share 1,200 s; at most 3 accepted candidates. EDA waiting is recorded separately.</text><text x="28" y="948" font-size="15" fill="#cbd5e1" font-weight="400">Failures consume slots. Conditional review changes task dependencies, not acceptance limits or available actions.</text></g></svg>