<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">PPA exploration · the decision workflow is the variable</title><desc id="desc">W0 deterministic heuristic, W1 AI optimizer, W2 AI optimizer and independent reviewer; all share frozen hardware, tools, budgets and engineering gates.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1440" height="760" rx="16" fill="#101827"/><rect width="1440" height="760" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">PPA exploration · the decision workflow is the variable</text><text x="28" y="78" font-size="16" fill="#cbd5e1" font-weight="400">Fixed RTL · 95 MHz · 36 legal parameter tuples · max 3 new physical candidates / session</text><text x="28" y="160" font-size="24" fill="#e0f2fe" font-weight="700">W0</text><text x="28" y="187" font-size="12" fill="#cbd5e1" font-weight="400">1 search</text><rect x="140" y="130" width="270" height="120" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="155" cy="152" r="4" fill="#2dd4bf"/><text x="167" y="158" font-size="16" fill="#f8fafc" font-weight="700">Report-driven rules</text><text x="154" y="187" font-size="13" fill="#cbd5e1" font-weight="400">Read actual session history</text><text x="154" y="209" font-size="13" fill="#cbd5e1" font-weight="400">Choose one unseen legal tuple</text><path d="M410 188 L710 188" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="456" y="172" font-size="13" fill="#94a3b8" font-weight="400">no review role</text><rect x="710" y="130" width="300" height="120" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="725" cy="152" r="4" fill="#2dd4bf"/><text x="737" y="158" font-size="16" fill="#f8fafc" font-weight="700">EDA + energy measurement</text><text x="724" y="187" font-size="13" fill="#cbd5e1" font-weight="400">Synthesis → route → extraction</text><text x="724" y="209" font-size="13" fill="#cbd5e1" font-weight="400">Workload VCD + SPEF → energy</text><path d="M1010 188 L1045 188" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1045" y="130" width="365" height="120" rx="10" fill="#18283f" stroke="#c4b5fd" stroke-width="1.5"/><circle cx="1060" cy="152" r="4" fill="#c4b5fd"/><text x="1072" y="158" font-size="16" fill="#f8fafc" font-weight="700">Common engineering gates</text><text x="1059" y="187" font-size="13" fill="#cbd5e1" font-weight="400">Function · timing · electrical · DRC · LVS</text><text x="1059" y="209" font-size="13" fill="#cbd5e1" font-weight="400">Source / clock / activity / RC completeness</text><path d="M1228 250 L1228 277 L275 277 L275 250" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="470" y="298" font-size="13" fill="#fcd34d" font-weight="400">pass or fail → next proposal; budget exhausted → final summary</text><text x="28" y="340" font-size="24" fill="#e0f2fe" font-weight="700">W1</text><text x="28" y="367" font-size="12" fill="#cbd5e1" font-weight="400">3 sessions</text><rect x="140" y="310" width="270" height="120" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="155" cy="332" r="4" fill="#38bdf8"/><text x="167" y="338" font-size="16" fill="#f8fafc" font-weight="700">AI PPA optimizer</text><text x="154" y="367" font-size="13" fill="#cbd5e1" font-weight="400">Read actual session history</text><text x="154" y="389" font-size="13" fill="#cbd5e1" font-weight="400">Choose one unseen legal tuple</