e / clock / activity / RC completeness</text><path d="M1228 610 L1228 637 L275 637 L275 610" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#feedback)" stroke-dasharray="6 4"/><text x="470" y="658" font-size="13" fill="#fcd34d" font-weight="400">pass or fail → next proposal; budget exhausted → final summary</text><text x="28" y="716" font-size="15" fill="#cbd5e1" font-weight="400">W1 / W2: 1,200 s aggregate AI time; EDA waiting separate. Failures consume slots. No RTL or checker changes.</text></g></svg>