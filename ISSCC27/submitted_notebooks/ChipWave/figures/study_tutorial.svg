dback)" stroke-dasharray="6 4"/><text x="863" y="572" font-size="13" fill="#fcd34d" font-weight="400">failed review → same designer</text><text x="728" y="607" font-size="14" fill="#5eead4" font-weight="400">Executed: all tasks satisfied · 0 new model calls</text><text x="728" y="628" font-size="12" fill="#94a3b8" font-weight="400">Saved, independently checked trial: ip-multi-1</text><text x="28" y="675" font-size="14" fill="#cbd5e1" font-weight="400">Offline lessons replay generated artifacts and execute real checks; separate opt-in commands run new AI trials.</text></g></svg>