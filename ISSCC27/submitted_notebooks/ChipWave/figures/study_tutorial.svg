<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Four edits, four frozen workflows</title><desc id="desc">Four executed offline lessons show role customization, an independent reviewer, dependency changes, and existing-IP integration.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#23334c"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7dd3fc"/></marker><marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fbbf24"/></marker></defs><rect width="1400" height="700" rx="16" fill="#101827"/><rect width="1400" height="700" fill="url(#dots)"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#f8fafc" font-weight="700">Four edits, four frozen workflows</text><text x="28" y="100" font-size="19" fill="#e0f2fe" font-weight="700">1 · Derive a custom role</text><rect x="28" y="124" width="194" height="104" rx="10" fill="#18283f" stroke="#38bdf8" stroke-width="1.5"/><circle cx="43" cy="146" r="4" fill="#38bdf8"/><text x="55" y="152" font-size="16" fill="#f8fafc" font-weight="700">Custom designer</text><text x="42" y="181" font-size="13" fill="#cbd5e1" font-weight="400">Replay saved RTL</text><rect x="242" y="124" width="194" height="104" rx="10" fill="#18283f" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="257" cy="146" r="4" fill="#2dd4bf"/><text x="269" y="152" font-size="16" fill="#f8fafc" font-weight="700">Tool checker</text><text x="256" y="181" font-size="13" fill="#cbd5e1" font-weight="400">Run Icarus checks</text><path d="M222 176 L242 176" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="322" font-size="14" fill="#5eead4" font-weight="400">Executed: all tasks satisfied · 0 new model calls</text><text x="28" y="3