[project]
name = "analog-block-integration"
version = "1.0.0"
description = "Making a Coupled Analog Circuit Tractable: an educational Code-a-Chip notebook with a reduced model and a SKY130/ngspice sample-and-hold example"
authors = [{ name = "Kazuki Fujita" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
    "ipykernel>=7.4.0",
]

[tool.uv]
# Scripts and a notebook, not an installable library.
package = false
