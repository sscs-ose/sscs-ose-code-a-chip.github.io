<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 650" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>How the sections follow: three recurring responses to a coupled circuit</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <g font-size="11" fill="#222">
    <!-- row 1 -->
    <rect x="230" y="14" width="540" height="52" rx="8" fill="#fdeee8" stroke="#222" stroke-width="1.3"/>
    <text x="244" y="36" font-size="12.5" font-weight="bold">A physically coupled analog circuit</text>
    <text x="244" y="54">driver, switch, Cs and clock form one network (Figure 1.1)</text>
    <text x="758" y="36" text-anchor="end" fill="#666">§1</text>

    <!-- row 2 -->
    <rect x="230" y="88" width="540" height="52" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
    <text x="244" y="110" font-size="12.5" font-weight="bold">Understand the mechanisms</text>
    <text x="244" y="128">provisional brief; which mechanism belongs to which requirement</text>
    <text x="758" y="110" text-anchor="end" fill="#666">§2.1–2.3</text>

    <!-- row 3: three complementary moves -->
    <rect x="20" y="172" width="310" height="104" rx="8" fill="#eaf2fb" stroke="#2a77d4" stroke-width="1.6"/>
    <text x="34" y="194" font-size="12.5" font-weight="bold">1  Reshape the coupling</text>
    <text x="34" y="214" font-style="italic" fill="#444">Can the circuit make the dependency</text>
    <text x="34" y="229" font-style="italic" fill="#444">weaker, move it, cancel or isolate it?</text>
    <text x="34" y="250">feedback, transmission gate,</text>
    <text x="34" y="265">dummy switches, bottom-plate sampling</text>
    <text x="318" y="194" text-anchor="end" fill="#666">§2.4</text>

    <rect x="345" y="172" width="310" height="104" rx="8" fill="#eaf2fb" stroke="#2a77d4" stroke-width="1.6"/>
    <text x="359" y="194" font-size="12.5" font-weight="bold">2  Choose the joint scope</text>
    <text x="359" y="214" font-style="italic" fill="#444">Which remaining interactions are</text>
    <text x="359" y="229" font-style="italic" fill="#444">designed and verified together?</text>
    <text x="359" y="250">joint, boundary before the switch,</text>
    <text x="359" y="265">or boundary after it</text>
    <text x="643" y="194" text-anchor="end" fill="#666">§2.5, §8</text>

    <rect x="670" y="172" width="310" height="104" rx="8" fill="#eaf2fb" stroke="#2a77d4" stroke-width="1.6"/>
    <text x="684" y="194" font-size="12.5" font-weight="bold">3  Represent what crosses</text>
    <text x="684" y="214" font-style="italic" fill="#444">What must the interface carry,</text>
    <text x="684" y="229" font-style="italic" fill="#444">and for which requirement?</text>
    <text x="684" y="250">Cs, range, Tacq, and the switch</text>
    <text x="684" y="265">as one resistance R_if</text>
    <text x="968" y="194" text-anchor="end" fill="#666">§2.6</text>

    <!-- row 4 -->
    <rect x="230" y="306" width="540" height="52" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
    <text x="244" y="328" font-size="12.5" font-weight="bold">Verification across ports, operating points, model levels</text>
    <text x="244" y="346">shows which requirement each choice and abstraction holds for</text>
    <text x="758" y="328" text-anchor="end" fill="#666">§3–5</text>

    <!-- row 5 -->
    <rect x="230" y="380" width="540" height="52" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
    <text x="244" y="402" font-size="12.5" font-weight="bold">Revision</text>
    <text x="244" y="420">of the circuit, the allocation, the requirements, the representation, or the scope</text>
    <text x="758" y="402" text-anchor="end" fill="#666">§6</text>

    <!-- row 6 -->
    <rect x="230" y="454" width="540" height="52" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
    <text x="244" y="476" font-size="12.5" font-weight="bold">Reuse in new contexts</text>
    <text x="244" y="494">a result travels with the conditions that decide whether it still applies</text>
    <text x="758" y="476" text-anchor="end" fill="#666">§7</text>

    <!-- row 7 -->
    <rect x="230" y="528" width="540" height="52" rx="8" fill="#f3eefa" stroke="#7a4fb0" stroke-width="1.5"/>
    <text x="244" y="550" font-size="12.5" font-weight="bold">AI may change the jointly tractable scope</text>
    <text x="244" y="568">larger joint search, including architectures; some boundaries stay</text>
    <text x="758" y="550" text-anchor="end" fill="#666">§9</text>
  </g>

  <g stroke="#222" stroke-width="1.5" fill="none">
    <path d="M500,66 V84" marker-end="url(#a)"/>
    <path d="M500,140 V156 H175 V168" marker-end="url(#a)"/>
    <path d="M500,140 V168" marker-end="url(#a)"/>
    <path d="M500,140 V156 H825 V168" marker-end="url(#a)"/>
    <path d="M175,276 V292 H500" />
    <path d="M825,276 V292 H500" />
    <path d="M500,276 V302" marker-end="url(#a)"/>
    <path d="M500,358 V376" marker-end="url(#a)"/>
    <path d="M500,432 V450" marker-end="url(#a)"/>
    <path d="M500,506 V524" marker-end="url(#a)"/>
  </g>
  <!-- revision loops back to the three moves -->
  <path d="M230,406 H10 V224 H16" stroke="#7a4fb0" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
  <path d="M770,406 H992 V224 H984" stroke="#7a4fb0" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
  <text x="120" y="398" font-size="11" fill="#7a4fb0" font-weight="bold" text-anchor="middle">revise and verify again</text>
  <text x="880" y="398" font-size="11" fill="#7a4fb0" font-weight="bold" text-anchor="middle">revise and verify again</text>

  <text x="500" y="608" font-size="11.5" fill="#222" text-anchor="middle">The three blue moves are complementary: what the architecture leaves coupled is what scope and interfaces must handle.</text>
  <text x="500" y="628" font-size="11" fill="#666" text-anchor="middle">All three rest on provisional assumptions and reduced models that hold only under stated conditions and for a stated requirement.</text>
</svg>
