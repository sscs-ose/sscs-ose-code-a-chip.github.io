<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 660" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>How the sample-and-hold teaching brief is assembled</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a77d4"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8613c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- column headings -->
  <text x="20" y="24" font-size="13" font-weight="bold" fill="#222">Stated assumptions</text>
  <text x="310" y="24" font-size="13" font-weight="bold" fill="#222">Derived requirements and budgets</text>
  <text x="670" y="24" font-size="13" font-weight="bold" fill="#222">Switch sizing and what it moves</text>

  <g transform="translate(0,30)">
    <!-- column 1: assumptions -->
    <g font-size="11" fill="#222">
      <rect x="20" y="40" width="230" height="58" rx="8" fill="#eaf2fb" stroke="#222" stroke-width="1.3"/>
      <text x="32" y="62" font-size="12.5" font-weight="bold">Operating range</text>
      <text x="32" y="82">Vtarget, Vprev in 0.6–1.2 V</text>

      <rect x="20" y="196" width="230" height="58" rx="8" fill="#eaf2fb" stroke="#222" stroke-width="1.3"/>
      <text x="32" y="218" font-size="12.5" font-weight="bold">10-bit-equivalent accuracy</text>
      <text x="32" y="238" font-size="11.5">deterministic error within ±1 VLSB</text>

      <rect x="20" y="296" width="230" height="58" rx="8" fill="#eaf2fb" stroke="#222" stroke-width="1.3"/>
      <text x="32" y="318" font-size="12.5" font-weight="bold">Timing assumption</text>
      <text x="32" y="338">Tacq = 40 ns</text>

      <rect x="20" y="436" width="230" height="58" rx="8" fill="#eaf2fb" stroke="#222" stroke-width="1.3"/>
      <text x="32" y="458" font-size="12.5" font-weight="bold">Capacitance assumption</text>
      <text x="32" y="478">Cs = 1 pF</text>
    </g>

    <!-- column 2: derived -->
    <g font-size="11" fill="#222">
      <rect x="310" y="20" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="42" font-size="12.5" font-weight="bold">Driver operating range</text>
      <text x="322" y="62">must track 0.6–1.2 V (measured: 0.52–1.50 V)</text>

      <rect x="310" y="100" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="122" font-size="12.5" font-weight="bold">Switch type</text>
      <text x="322" y="142">transmission gate; NMOS alone fails near 1.2 V</text>

      <rect x="310" y="196" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="218" font-size="12.5" font-weight="bold">Settling share ε = 0.29 mV ≈ ½ VLSB</text>
      <text x="322" y="238">0.6 V / ε ≈ 2070: about 7.6 time constants</text>

      <rect x="310" y="296" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="318" font-size="12.5" font-weight="bold">Time-constant budget</text>
      <text x="322" y="338">about 5.3 ns in total for driver + switch</text>

      <rect x="310" y="376" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="398" font-size="12.5" font-weight="bold">Switch share of the budget</text>
      <text x="322" y="418">Ron·Cs ≲ 1 ns, so Ron,max ≲ 1 kΩ</text>

      <rect x="310" y="466" width="290" height="58" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
      <text x="322" y="488" font-size="12.5" font-weight="bold">Sampled kT/C noise</text>
      <text x="322" y="508">64 µV rms ≈ 0.11 VLSB (separate noise entry)</text>
    </g>

    <!-- column 3: switch sizing and consequences -->
    <g font-size="11" fill="#222">
      <rect x="670" y="20" width="320" height="58" rx="8" fill="#fdeee8" stroke="#222" stroke-width="1.3"/>
      <text x="682" y="42" font-size="12.5" font-weight="bold">Charge per full-scale transition</text>
      <text x="682" y="62">0.6 V × 1 pF = 0.6 pC through the switch</text>

      <rect x="670" y="250" width="320" height="58" rx="8" fill="#eaf2fb" stroke="#222" stroke-width="1.3"/>
      <text x="682" y="272" font-size="12.5" font-weight="bold">Switch width 15 µm / 30 µm</text>
      <text x="682" y="292">smallest width meeting Ron,max ≲ 1 kΩ</text>

      <rect x="718" y="330" width="272" height="50" rx="8" fill="#fdeee8" stroke="#222" stroke-width="1.3"/>
      <text x="730" y="350" font-size="12" font-weight="bold">On-resistance</text>
      <text x="730" y="368">96–744 Ω over the range (measured)</text>

      <rect x="718" y="396" width="272" height="50" rx="8" fill="#fdeee8" stroke="#222" stroke-width="1.3"/>
      <text x="730" y="416" font-size="12" font-weight="bold">Gate and overlap capacitance</text>
      <text x="730" y="434">turn-on disturbance, inside Tacq</text>

      <rect x="718" y="462" width="272" height="50" rx="8" fill="#fdeee8" stroke="#222" stroke-width="1.3"/>
      <text x="730" y="482" font-size="12" font-weight="bold">Channel charge, clock coupling</text>
      <text x="730" y="500">turn-off hold step: share ¼ VLSB</text>
    </g>

    <!-- arrows: engineering choice (blue), approximate allocation (green dashed), physical consequence (orange) -->
    <g fill="none" stroke-width="1.6">
      <path d="M250,62 H282 V49 H306" stroke="#2e8b57" stroke-dasharray="6 4" marker-end="url(#ag)"/>
      <path d="M250,76 H282 V129 H306" stroke="#2a77d4" marker-end="url(#ab)"/>
      <path d="M250,88 H268 V212 H306" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M250,232 H306" stroke="#2e8b57" stroke-dasharray="6 4" marker-end="url(#ag)"/>
      <path d="M455,254 V292" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M250,325 H306" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M455,354 V372" stroke="#2e8b57" stroke-dasharray="6 4" marker-end="url(#ag)"/>
      <path d="M250,456 H282 V412 H306" stroke="#2e8b57" stroke-dasharray="6 4" marker-end="url(#ag)"/>
      <path d="M250,476 H282 V495 H306" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M600,129 H636 V270 H666" stroke="#2a77d4" marker-end="url(#ab)"/>
      <path d="M600,405 H636 V290 H666" stroke="#2a77d4" marker-end="url(#ab)"/>
      <path d="M696,308 V487" stroke="#e8613c"/>
      <path d="M696,355 H714" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M696,421 H714" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M696,487 H714" stroke="#e8613c" marker-end="url(#ao)"/>
      <path d="M670,49 H604" stroke="#e8613c" marker-end="url(#ao)"/>
    </g>
    <text x="636" y="96" font-size="10" fill="#e8613c" text-anchor="middle">output</text>
    <text x="636" y="108" font-size="10" fill="#e8613c" text-anchor="middle">current</text>
    <text x="840" y="110" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">from the range and Cs; supplied or</text>
    <text x="840" y="124" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">sunk by the driver's output stage</text>
    <text x="455" y="546" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">the other ½ VLSB: turn-off, driver static error, other effects</text>
    <text x="840" y="200" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">uses the measured DC on-resistance</text>
    <text x="840" y="214" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">of candidate widths (Section 2.3)</text>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#222">
    <line x1="30" y1="600" x2="80" y2="600" stroke="#2a77d4" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="90" y="604">engineering choice</text>
    <line x1="260" y1="600" x2="310" y2="600" stroke="#2e8b57" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ag)"/>
    <text x="320" y="604">approximate allocation (a share of a budget)</text>
    <line x1="640" y1="600" x2="690" y2="600" stroke="#e8613c" stroke-width="1.8" marker-end="url(#ao)"/>
    <text x="700" y="604">physical or arithmetic consequence</text>
    <text x="30" y="636" font-size="11" fill="#666">Blue boxes: stated choices. White: derived requirements and budgets. Orange: physical quantities that follow from the choices.</text>
  </g>
</svg>
