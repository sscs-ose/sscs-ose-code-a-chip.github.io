<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>When each sampled-data error mechanism acts, and which requirement it belongs to</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <!-- clock -->
  <text x="20" y="62" font-size="12" font-weight="bold" fill="#222">switch gate</text>
  <text x="20" y="78" font-size="10.5" fill="#666">phi (phib inverted)</text>
  <path d="M170,80 H300 L304,40 H760 L764,80 H960" stroke="#222" stroke-width="2" fill="none"/>
  <text x="302" y="30" font-size="11" fill="#222" text-anchor="middle">switch closes</text>
  <text x="762" y="30" font-size="11" fill="#222" text-anchor="middle">switch opens</text>
  <path d="M310,100 H754" stroke="#222" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)" fill="none"/>
  <text x="532" y="116" font-size="11.5" fill="#222" text-anchor="middle">acquisition interval Tacq = 40 ns: Vsamp moves from Vprev toward Vtarget</text>
  <text x="860" y="100" font-size="11.5" fill="#222" text-anchor="middle">hold</text>
  <line x1="762" y1="40" x2="762" y2="440" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="302" y1="40" x2="302" y2="440" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- mechanism bars -->
  <g font-size="11" fill="#222">
    <rect x="302" y="140" width="80" height="44" rx="5" fill="#fbd9cc" stroke="#e8613c" stroke-width="1.3"/>
    <text x="392" y="158" font-weight="bold">turn-on disturbance</text>
    <text x="392" y="175" fill="#444">clock edges couple through gate and overlap capacitances into out and Cs</text>

    <rect x="302" y="198" width="460" height="44" rx="5" fill="#fbd9cc" stroke="#e8613c" stroke-width="1.3"/>
    <text x="314" y="216" font-weight="bold">acquisition settling</text>
    <text x="314" y="233" fill="#444">driver dynamics, Ron, Cs, the transition Vprev → Vtarget</text>

    <rect x="302" y="256" width="460" height="44" rx="5" fill="#e9e9f6" stroke="#5b5bb0" stroke-width="1.3"/>
    <text x="314" y="274" font-weight="bold">thermal and driver noise</text>
    <text x="314" y="291" fill="#444">kT/C of the switch on Cs, plus driver noise, frozen when the switch opens</text>

    <rect x="762" y="314" width="198" height="44" rx="5" fill="#fff1cc" stroke="#b58500" stroke-width="1.3"/>
    <text x="774" y="332" font-weight="bold">turn-off hold step</text>
    <text x="774" y="349" fill="#444">channel charge, clock coupling</text>

    <rect x="170" y="372" width="790" height="44" rx="5" fill="#eeeeee" stroke="#888" stroke-width="1.3"/>
    <text x="182" y="390" font-weight="bold">static errors</text>
    <text x="182" y="407" fill="#444">driver offset, gain and reference errors: present at every instant</text>
  </g>

  <!-- requirement labels -->
  <g font-size="11" font-weight="bold">
    <text x="20" y="168" fill="#e8613c">ε = 0.29 mV</text>
    <text x="20" y="226" fill="#e8613c">ε = 0.29 mV</text>
    <text x="20" y="284" fill="#5b5bb0">noise budget</text>
    <text x="20" y="335" fill="#b58500">held-sample accuracy</text>
    <text x="20" y="350" fill="#b58500">(¼ VLSB share)</text>
    <text x="20" y="400" fill="#666">static budget</text>
  </g>
  <path d="M140,148 Q152,148 152,160 V222 Q152,234 140,234" stroke="#e8613c" stroke-width="1.4" fill="none"/>

  <!-- evaluation instant -->
  <circle cx="762" cy="220" r="5" fill="#222"/>
  <text x="770" y="214" font-size="11" fill="#222">settling error</text>
  <text x="770" y="228" font-size="11" fill="#222">evaluated here</text>

  <text x="500" y="460" font-size="11.5" fill="#222" text-anchor="middle">Orange rows count against the acquisition-settling tolerance ε; the other rows are budgeted separately and need different circuit remedies.</text>
  <text x="500" y="480" font-size="11" fill="#666" text-anchor="middle">Not to scale. The turn-on disturbance begins at the switch-closing edge and decays during acquisition; the turn-off step is fixed at the opening edge.</text>
</svg>
